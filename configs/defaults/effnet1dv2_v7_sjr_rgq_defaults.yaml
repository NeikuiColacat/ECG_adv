extends: common_v7_sjr_rgq_super5.yaml

model:
  backbone: efficientnet1dv2
  num_classes: 5
  init_checkpoint: ${paths.data_root}/triple_labels/super5_minresample_full10_perglobal_20260503/best_model.pt
  direct_init_root: ${paths.output_root}/effnet_direct_k500_v7_sjr_rgq/${runtime.run_id}/runs

training:
  epochs: 30
  batch_size: 128
  eval_batch_size: 192
  num_workers: ${resources.default_num_workers}
  amp: false
  optimizer:
    name: adamw
    lr: 0.00005
    weight_decay: 0.0001
  grad_clip: 1.0
  pos_weight_clip_max: 50.0

postprocess:
  commands:
    - name: export_metrics_long
      entrypoint: scripts/export_metrics_long.py
      env:
        TMPDIR: ${paths.short_tmp_root}
        XDG_CACHE_HOME: ${paths.cache_root}
      argv:
        - --input
        - ${paths.output_root}/${experiment.name}/${runtime.run_id}
        - --output-dir
        - ${paths.output_root}/metrics_export/${runtime.run_id}_${experiment.name}
        - --run-id
        - ${experiment.name}
        - --filter-to-target-center
        - --target-centers
        - ${paper_protocol.centers.target_4}
        - --expected-mapping-version
        - ${paper_protocol.mapping_version}
        - --expected-mapping-hash
        - ${paper_protocol.mapping_hash}
      expected_artifacts:
        - role: metrics_long
          path: ${paths.output_root}/metrics_export/${runtime.run_id}_${experiment.name}/metrics_long.csv
        - role: artifact_manifest
          path: ${paths.output_root}/metrics_export/${runtime.run_id}_${experiment.name}/artifact_manifest.json

    - name: export_paper_table_all_zero_kept
      entrypoint: scripts/export_paper_table.py
      env:
        TMPDIR: ${paths.short_tmp_root}
        XDG_CACHE_HOME: ${paths.cache_root}
      argv:
        - --metrics-long
        - ${paths.output_root}/metrics_export/${runtime.run_id}_${experiment.name}/metrics_long.csv
        - --output-dir
        - ${paths.output_root}/paper_table/${runtime.run_id}_${experiment.name}_all_zero_kept
        - --view
        - pn2021_all_zero_kept_refexcluded
        - --dataset
        - pn2021
        - --centers
        - ${paper_protocol.centers.target_4}
        - --no-dataset-rows
      expected_artifacts:
        - role: paper_table
          path: ${paths.output_root}/paper_table/${runtime.run_id}_${experiment.name}_all_zero_kept/paper_table.csv
        - role: paper_table_manifest
          path: ${paths.output_root}/paper_table/${runtime.run_id}_${experiment.name}_all_zero_kept/paper_table_manifest.json

    - name: export_paper_table_drop_all_zero
      entrypoint: scripts/export_paper_table.py
      env:
        TMPDIR: ${paths.short_tmp_root}
        XDG_CACHE_HOME: ${paths.cache_root}
      argv:
        - --metrics-long
        - ${paths.output_root}/metrics_export/${runtime.run_id}_${experiment.name}/metrics_long.csv
        - --output-dir
        - ${paths.output_root}/paper_table/${runtime.run_id}_${experiment.name}_drop_all_zero
        - --view
        - pn2021_drop_all_zero_refexcluded
        - --dataset
        - pn2021
        - --centers
        - ${paper_protocol.centers.target_4}
        - --no-dataset-rows
      expected_artifacts:
        - role: paper_table
          path: ${paths.output_root}/paper_table/${runtime.run_id}_${experiment.name}_drop_all_zero/paper_table.csv
        - role: paper_table_manifest
          path: ${paths.output_root}/paper_table/${runtime.run_id}_${experiment.name}_drop_all_zero/paper_table_manifest.json
