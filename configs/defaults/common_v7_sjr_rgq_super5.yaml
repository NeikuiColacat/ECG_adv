experiment:
  version: 1
  owner: linbinhao
  status: active-main

paper_protocol:
  mapping_version: v7_super5_sjr_rgq_review_20260528
  mapping_hash: 555ec85d5b51
  class_order: [CD, HYP, MI, NORM, STTC]
  num_classes: 5
  centers:
    target_4: [ningbo, chapman_shaoxing, cpsc_2018, georgia]
    eval_7: [chapman_shaoxing, cpsc_2018, cpsc_2018_extra, georgia, ningbo, ptb, st_petersburg_incart]
  kshot:
    mode: fixed_k
    k: 500
    seed: 20260531
    subset_seed: 20260531
    exclude_refs_from_eval: true
  selection:
    policy: k500_internal_val_plus_source_floor
    allowed_data: [target_k500_train_split, target_k500_internal_val, ptbxl_source_floor]
    forbid_heldout_target_labels: true
    forbid_full_target_distribution_tuning: true

data:
  source_dataset: ptbxl
  target_dataset: pn2021
  pn2021_cache_version: v7_super5_sjr_rgq_review
  pn2021_centers: ${paper_protocol.centers.target_4}
  exclude_centers: [ptb-xl, ptbxl]
  roots:
    ptbxl: ${paths.data_root}/ptbxl
    pn2021: ${paths.data_root}/physionet2021
  cache:
    pn2021_cache_dir: ${paths.data_root}/triple_labels/pn2021_eval_cache
    pn2021_mmap_cache_dir: ${paths.data_root}/triple_labels/pn2021_eval_cache_mmap
    prefer_mmap: true
  kshot_subset_root: ${paths.data_root}/paper_vae_only_latenthull_sweep_20260516_v7_sjr_rgq/subsets

preprocess:
  contract_id: ptbxl_pn2021_super5_ecgtwin_decode_v1
  classifier_fs: 100
  classifier_len: 1000
  crop_len: 1000
  mode: minimal_resample
  norm_mode: per_sample_global
  lead_order: ptbxl
  ecgtwin_decode:
    input_len: 1024
    output_len: 1000
    reorder_indices: [0, 1, 2, 3, 5, 4, 6, 7, 8, 9, 10, 11]

evaluation:
  views:
    - pn2021_all_zero_kept_refexcluded
    - pn2021_drop_all_zero_refexcluded
    - ptbxl_fold10_source_floor
  metrics:
    - macro_auroc
    - macro_auprc
    - per_center
    - per_class
  min_pos: 10
  pn2021_limit: 0

logging:
  launch_artifacts:
    - run_config.resolved.yaml
    - run_config.resolved.json
    - run_manifest.json
    - command.sh
    - data_manifest.json
    - k500_ref_ids.json
    - selection.json
    - run_card.json
    - run_file_index.json
    - summary.md
  child_artifacts:
    - best_model.pt
    - training_log.json
    - train_result.json
    - eval_result_v7_exclrefs_crop1000.json
  postprocess_artifacts:
    - metrics_long.csv

runner:
  env:
    ECG_ADV_GEN_DATA_ROOT: ${paths.data_root}
    TMPDIR: ${paths.short_tmp_root}
    XDG_CACHE_HOME: ${paths.cache_root}
