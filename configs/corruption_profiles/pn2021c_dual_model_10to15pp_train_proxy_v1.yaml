metadata:
  profile_name: dual_model_10to15pp_train_proxy_v1
  intended_use: training_only_100hz_raw_pre_zscore_augmix_proxy
  eval_profile: configs/corruption_profiles/pn2021c_dual_model_10to15pp_v1.yaml
  rationale: >-
    The frozen PN2021-C evaluation profile uses native_raw_first powerline
    injection with max_amplitude=32. In the EfficientNet training graph the
    locked three-chain AugMix corruption chains operate on 100Hz/1000 ECG, so
    using amplitude 32 creates a much stronger Nyquist-adjacent proxy than the
    intended native_raw_first stressor. Amplitude 8 keeps the training proxy
    near the historical 10-20pp raw-first powerline calibration while preserving
    the frozen evaluation benchmark unchanged.
