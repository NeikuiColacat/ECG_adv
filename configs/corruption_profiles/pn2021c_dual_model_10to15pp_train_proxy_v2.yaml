metadata:
  profile_name: dual_model_10to15pp_train_proxy_v2
  intended_use: training_only_100hz_raw_pre_zscore_augmix_proxy
  eval_profile: configs/corruption_profiles/pn2021c_dual_model_10to15pp_v1.yaml
  rationale: >-
    v1 used 100Hz powerline amplitude 8 as a conservative proxy for the frozen
    native_raw_first evaluation profile. cand31/cand33 evidence shows powerline
    remains the weakest recovered operator, while powerline-only frequency
    reweighting hurts the other operators. v2 changes only the training
    powerline proxy amplitude to 16 so CPSC probes can test whether the gap is
    profile mismatch rather than operator scheduling.
