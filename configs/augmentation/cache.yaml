    2: 10
    3: 10
  combination_policy: all_canonical_combinations_without_replacement
  operator_order_policy: canonical_order
  normalization: none
  signal_units: mV

output:
  cache_dir: ./cache/pn2021c_paper_anchored_s5_depth23_5center_dualrate_v1
  waveform_100hz_file: signals_100hz.npy
  waveform_500hz_file: signals_500hz.npy
  layout: view_record_time_channel
  dtype: float32
  interpolation_500_to_100: linear_align_corners

execution:
  backend: numpy
  chunk_size: 16
  checkpoint_every_chunks: 8
  resume: true
