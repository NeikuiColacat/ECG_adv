host:
  name: linbinhao_shared_server
  shared_server: true
  home_root: /home/linbinhao

paths:
  data_root: /home/linbinhao/ECG_adv_data
  model_root: ${paths.data_root}/models
  output_root: ${paths.data_root}/runs
  cache_root: ${paths.data_root}/cache
  tmp_root: ${paths.data_root}/tmp
  short_tmp_root: /home/linbinhao/tmp_ecg

python:
  executable: /home/linbinhao/micromamba/envs/ECGTwin/bin/python
  micromamba_env: ECGTwin

resources:
  default_num_workers: 4
  prefer_single_gpu: true
  require_nvidia_smi_check: true
  default_bind_host: 127.0.0.1

safety:
  forbid_sudo: true
  forbid_system_env_changes: true
  write_boundary: /home/linbinhao
  forbid_commit_large_artifacts: true

external_models:
  allowed_target_roots:
    - ${paths.model_root}
    - ${paths.data_root}
  repos:
    DeepECG:
      target: ${paths.model_root}/DeepECG
      url: https://github.com/HeartWise-AI/DeepECG_Docker.git
    ECGTwin:
      target: ${paths.model_root}/ECGTwin
      url: https://github.com/Raiiyf/ECGTwin.git
    advdiff:
      target: ${paths.model_root}/advdiff
      url: https://github.com/EricDai0/advdiff.git
    ecg_ptbxl_benchmarking:
      target: ${paths.model_root}/ecg_ptbxl_benchmarking
      url: https://github.com/helme/ecg_ptbxl_benchmarking.git
    ecgfounder:
      target: ${paths.data_root}/ecgfounder
      url: https://github.com/PKUDigitalHealth/ECGFounder.git
