  class_order:
  - CD
  - HYP
  - MI
  - NORM
  - STTC
  historical_policy: drop_from_public_tree_unless_latest_mainline
  excluded_main_method_branches:
  - stabilizer_frontend
  - raw_supervised_branch
  - single_chain_shortcut
  - operator_oracle
  - post_hoc_selector
  stages:
  - name: effnet_direct_k500_v7
    role: efficientnet_direct_baseline
    config: configs/experiments/effnet_direct_k500_v7_sjr_rgq.yaml
  - name: effnet_direct_k500_v7_pn2021_clean
    role: efficientnet_direct_baseline_pn2021_clean_refexcluded_eval
    config: configs/experiments/pn2021_eval_v7_sjr_rgq_refexcluded.yaml
  - name: effnet_threechain_locked_train
    role: efficientnet_main_method_train
    config: configs/experiments/effnet_vae_lhat_augmix_threechain_locked_k500.yaml
  - name: effnet_threechain_locked_pn2021c_s5
    role: efficientnet_main_method_pn2021c_eval
    config: configs/experiments/pn2021c_effnet_threechain_locked_official_s5.yaml
  - name: effnet_threechain_locked_pn2021c_depth23
    role: efficientnet_main_method_depth23_composite_eval
    config: configs/experiments/pn2021c_effnet_official_s5_depth23_composite.yaml
  - name: ecgfounder_ptbxl_locked_fullft
    role: ecgfounder_source_fullft_prerequisite
    config: configs/experiments/ecgfounder_ptbxl_super5_fullft_locked.yaml
  - name: ecgfounder_k500_locked_fullft
    role: ecgfounder_k500_fullft_prerequisite
    config: configs/experiments/ecgfounder_k500_fullft_locked.yaml
  - name: ecgfounder_threechain_locked_train
    role: ecgfounder_main_method_train
    config: configs/experiments/ecgfounder_vae_lhat_augmix_threechain_locked_k500.yaml
  - name: ecgfounder_threechain_locked_pn2021c_s5
    role: ecgfounder_main_method_pn2021c_eval
    config: configs/experiments/pn2021c_ecgfounder_threechain_locked_official_s5.yaml
  - name: ecgfounder_threechain_locked_pn2021c_depth23
    role: ecgfounder_main_method_depth23_composite_eval
    config: configs/experiments/pn2021c_ecgfounder_official_s5_depth23_composite.yaml
