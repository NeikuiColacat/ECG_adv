version: 1
updated: 2026-05-27
purpose: Track which legacy scripts are managed by YAML configs during the refactor.

source_of_truth:
  shared_server_safety: AGENTS.md
  yaml_refactor_plan: docs/tmp_md/project_refactor_yaml_config_plan_20260527.md
  config_rules: configs/README.md
  active_evidence_registry: configs/active_evidence_registry.yaml
  pipeline_index: docs/pipelines/refactor_source_of_truth_20260527.md
  super5_label_mapping: scripts/triple_labels/label_schemes.py
  super5_label_metadata: ecg_adv_gen/labels/super5.py
  data_preprocess_contract: ecg_adv_gen/data/contracts.py
  evaluation_view_semantics: ecg_adv_gen/evaluation/views.py
  selection_policy_semantics: ecg_adv_gen/evaluation/selection.py
  ecgfounder_model_contract: ecg_adv_gen/models/ecgfounder.py
  training_loss_helpers: ecg_adv_gen/training/losses.py

launcher:
  script: scripts/run_experiment.py
  config_package: ecg_adv_gen/config
  mode:
    dry_run: supported
    execute: supported_with_gpu_safety_gates
  launch_artifacts:
    - run_config.resolved.yaml
    - run_config.resolved.json
    - run_manifest.json
    - command.sh
    - data_manifest.json
    - k500_ref_ids.json
    - selection.json
    - run_card.json
    - run_file_index.json
    - summary.md
  content_checks:
    - eval_result_mapping_metadata
    - k500_ref_ids_integrity
    - selection_policy_record
    - optional_required_epoch_metrics_in_training_log
    - run_id_scoped_child_and_postprocess_outputs
  execution_logs:
    - logs/command_XX.log
    - logs/command_XX.stdout.log
    - logs/command_XX.stderr.log
    - logs/postprocess_XX.log
    - logs/postprocess_XX.stdout.log
    - logs/postprocess_XX.stderr.log
    - stdout.log
    - stderr.log
  postprocess:
    status: supported_for_reporting_exports
    allowlist:
      - scripts/export_data_manifest.py
      - scripts/export_metrics_long.py
      - scripts/merge_metrics_long.py
      - scripts/export_paper_table.py

run_record_layout:
  status: active
  required_files:
    - run_card.json
    - run_file_index.json
    - summary.md
  required_directories:
    - configs/
    - manifests/
    - logs/
    - checkpoints/
    - eval/
    - diagnostics/
    - reports/
    - artifacts/

managed_experiments:
  - name: effnet_direct_k500_v6
    status: active_wrapped
    config: configs/experiments/effnet_direct_k500_v6.yaml
    legacy_entrypoint: scripts/paper/run_direct_finetune_k500_20260516.py
    launcher: scripts/run_experiment.py
    method_family: direct_target_k500_finetune
    mapping_version: v7_super5_sjr_rgq_review_20260528
    owns_training_logic: false
    notes: Stable first wrapper; one legacy command covers the four target centers and passes managed --out_root.

  - name: effnet_vae_lhat_k500_v6
    status: active_wrapped
    config: configs/experiments/effnet_vae_lhat_k500_v6.yaml
    legacy_entrypoint: scripts/paper/run_effnet_latent_augmix_stage3_20260524.py
    launcher: scripts/run_experiment.py
    method_family: vae_latent_hull_online_at
    mapping_version: v7_super5_sjr_rgq_review_20260528
    owns_training_logic: false
    notes: Expands to one legacy command per target center; uses seed20260531 K500 anchors, direct-K500 init checkpoints, compatsoft direct-init LHAT parameters, and target_real_val quick selection.

  - name: ecgfounder_inithead_fullft_k500_v6
    status: active_wrapped
    config: configs/experiments/ecgfounder_inithead_fullft_k500_v6.yaml
    legacy_entrypoint: scripts/paper/run_ecgfounder_fullft_super5_pilot_20260523.py
    launcher: scripts/run_experiment.py
    method_family: ecgfounder_full_finetune_k500
    mapping_version: v7_super5_sjr_rgq_review_20260528
    owns_training_logic: false
    notes: Direct init-head full fine-tune control with explicit ref_meta, K500, init_head, and target-val selector.

  - name: ecgfounder_direct_k500_v6
    status: active_wrapped
    config: configs/experiments/ecgfounder_direct_k500_v6.yaml
    legacy_entrypoint: scripts/paper/run_ecgfounder_kshot_head_ft_20260517.py
    launcher: scripts/run_experiment.py
    method_family: ecgfounder_frozen_feature_direct_k500_head_finetune
    mapping_version: v7_super5_sjr_rgq_review_20260528
    owns_training_logic: false
    notes: Frozen ECGFounder feature direct K500 Super5 head fine-tune baseline; one legacy command covers all four target centers and traces the v6 linear-probe head/features plus K500 ref-meta.

  - name: ecgfounder_vae_lhat_k500_v6
    status: active_wrapped
    config: configs/experiments/ecgfounder_vae_lhat_k500_v6.yaml
    legacy_entrypoint: scripts/paper/run_ecgfounder_vae_only_lhat_head_ft_20260523.py
    launcher: scripts/run_experiment.py
    method_family: ecgfounder_vae_latent_hull_online_at
    mapping_version: v7_super5_sjr_rgq_review_20260528
    owns_training_logic: false
    notes: Residual-adapter VAE-only Latent-Hull online AT wrapper; expands one command per target center, uses seed20260531 K500 latent anchors, K500 direct heads as frozen base heads, hard-BCE anchor sampling, and target_real_val checkpoint selection.

  - name: pn2021_eval_v6_refexcluded
    status: active_wrapped
    config: configs/experiments/pn2021_eval_v6_refexcluded.yaml
    legacy_entrypoint: scripts/triple_labels/eval_crosscenter.py
    launcher: scripts/run_experiment.py
    method_family: managed_pn2021_refexcluded_eval
    mapping_version: v7_super5_sjr_rgq_review_20260528
    owns_training_logic: false
    notes: Expands to one eval command per direct-K500 target-center model; each command excludes all four K500 ref-meta files and reports both all-zero-kept and drop-all-zero PN2021 views.

reporting_tools:
  - name: data_manifest_exporter
    status: active
    script: scripts/export_data_manifest.py
    package: ecg_adv_gen/data/manifest.py
    output_artifacts:
      - data_manifest.json
    safety_rules:
      - checks_paths_stay_under_write_boundary
      - records_target_and_eval_center_directories_without_recursive_scan
      - can_require_existing_paths_for_preflight

  - name: metrics_long_exporter
    status: active
    script: scripts/export_metrics_long.py
    package: ecg_adv_gen/reporting/metrics_export.py
    output_artifacts:
      - metrics_long.csv
      - artifact_manifest.json
    safety_rules:
      - refuses_mixed_mapping_by_default
      - keeps_all_zero_and_drop_all_zero_as_separate_views
      - writes_canonical_view_aliases_without_dropping_raw_view
      - supports_method_run_id_override_for_per_center_artifacts
      - can_filter_crosscenter_eval_to_inferred_target_center

  - name: metrics_long_merger
    status: active
    script: scripts/merge_metrics_long.py
    package: ecg_adv_gen/reporting/metrics_merge.py
    output_artifacts:
      - metrics_long.csv
      - merge_manifest.json
    safety_rules:
      - refuses_mixed_mapping_by_default
      - rejects_duplicate_metric_keys_after_merge
      - preserves_raw_views_and_canonical_views

  - name: paper_table_exporter
    status: active
    script: scripts/export_paper_table.py
    package: ecg_adv_gen/reporting/paper_tables.py
    output_artifacts:
      - paper_table.csv
      - paper_table_manifest.json
    safety_rules:
      - requires_explicit_view
      - refuses_mixed_mapping_by_default
      - filters_by_canonical_view_and_exports_raw_views
      - computes_deltas_only_against_matching_baseline_scope

  - name: managed_config_auditor
    status: active
    script: scripts/audit_managed_configs.py
    package: ecg_adv_gen/config/audit.py
    output_artifacts:
      - managed_config_audit.json
      - managed_config_audit.csv
    safety_rules:
      - cpu_only_no_legacy_child_scripts
      - audits_all_active_wrapped_configs_from_active_script_index
      - can_verify_required_input_artifacts_without_checking_child_outputs
      - writes_reports_only_under_explicit_write_boundary

  - name: active_evidence_registry_auditor
    status: active
    script: scripts/agent/audit_agent_workspace.py
    package: ecg_adv_gen/evidence/registry.py
    output_artifacts:
      - agent_workspace_audit.json
    safety_rules:
      - cpu_only_no_gpu_no_child_training
      - validates_active_evidence_registry
      - checks_mapping_k500_ref_exclusion_metrics_and_comparison_bundle
      - warns_on_guarded_external_model_dirty_paths

  - name: legacy_vae_manifest_backfiller
    status: active
    script: scripts/agent/backfill_vae_lhat_manifest.py
    package: ecg_adv_gen/evidence/backfill.py
    output_artifacts:
      - run_manifest.backfilled.json
    safety_rules:
      - cpu_only_no_gpu_no_training
      - reads_legacy_launch_train_eval_artifacts
      - writes_only_under_explicit_write_boundary
      - records_artifact_hashes_for_v7_vae_lhat_evidence

  - name: direct_vs_vae_comparison_bundler
    status: active
    script: scripts/agent/build_comparison_bundle.py
    package: ecg_adv_gen/evidence/comparison.py
    output_artifacts:
      - comparison_manifest.json
      - metrics_long.csv
      - comparison_delta.csv
      - paper_table_pn2021_all_zero_kept_refexcluded.csv
      - paper_table_pn2021_drop_all_zero_refexcluded.csv
    safety_rules:
      - builds_from_registry_declared_metrics_only
      - refuses_nonempty_output_without_force
      - records_source_metric_hashes_and_baseline_run_id

  - name: run_finalizer
    status: active
    script: scripts/agent/finalize_run.py
    package: ecg_adv_gen/evidence/run_record.py
    output_artifacts:
      - run_card.json
      - run_file_index.json
      - summary.md
    safety_rules:
      - cpu_only_no_gpu_no_training
      - writes_only_under_explicit_write_boundary
      - records_experiment_purpose_result_summary_protocol_and_metric_summary
      - creates_agent_readable_file_categories_without_moving_large_checkpoints

  - name: run_registry_updater
    status: active
    script: scripts/agent/register_run.py
    package: ecg_adv_gen/evidence/run_record.py
    output_artifacts:
      - configs/active_evidence_registry.yaml
    safety_rules:
      - cpu_only_no_gpu_no_training
      - stores_run_paths_with_paths_output_root_placeholders
      - idempotently_replaces_existing_run_registration
      - refuses_run_dirs_outside_paths_output_root

legacy_hold:
  - path: scripts/pgd_cross_center/synth_online_at_super5.py
    status: do_not_move_yet
    reason: Large online AT orchestrator; current behavior is encoded in CLI defaults and active wrappers.
    future_package_target: ecg_adv_gen/adaptation

  - path: scripts/triple_labels/train_ptbxl.py
    status: do_not_move_yet
    reason: Stable classifier training entrypoint used by old and new runs; shared loss/pos_weight helpers are now imported from ecg_adv_gen.training for compatibility.
    future_package_target: ecg_adv_gen/training

  - path: scripts/triple_labels/eval_crosscenter.py
    status: do_not_move_yet
    reason: Source of PN2021 evaluation/cache behavior and ref-exclusion mechanics.
    future_package_target: ecg_adv_gen/evaluation

  - path: scripts/ecgtwin_author_repro
    status: do_not_move_yet
    reason: Author reproduction output layout should remain stable for thesis traceability.
    future_package_target: ecg_adv_gen/ecgtwin

  - path: scripts/paper
    status: do_not_move_yet
    reason: Dated experiment snapshots are evidence; wrap first, extract later.
    future_package_target: scripts_thin_wrappers

do_not_commit_or_move:
  - path: model/DeepECG
    reason: External model repo link handle; local target is host-specific.
  - path: model/ECGTwin
    reason: External model repo link handle; local target is host-specific.
  - path: model/advdiff
    reason: External model repo link handle; local target is host-specific.
  - path: model/ecg_ptbxl_benchmarking
    reason: External model repo link handle; local target is host-specific.
  - path: model/ecgfounder
    reason: External model repo link handle; local target is host-specific.
