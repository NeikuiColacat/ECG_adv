launch_surface_policy:
  default_launcher: scripts/run_experiment.py
  managed_index: configs/active_scripts.yaml
  config_roots:
    - configs/defaults
    - configs/experiments
  tracked_yaml_required: true
  new_long_bash_launchers_allowed: false
  new_dated_matrix_scripts_allowed: false
  human_exception_requires_index_update: true
  gpu_binding_location: external_environment_after_nvidia_smi
  legacy_bash_role: historical_reference_or_project_setup_only
  safety_rules:
    - no_tracked_gpu_ids
    - no_host_absolute_paths
    - run_id_scoped_outputs
    - legacy_entrypoint_kept_as_thin_wrapper
    - optional_runner_adapter_builds_legacy_argv_from_typed_yaml

documentation_surface_policy:
  durable_process_docs: docs/pipelines
  historical_report_archive: docs/reports/archive
  handoff_notes: docs/codex-handoffs
  active_evidence_sources:
    - configs/active_evidence_registry.yaml
    - registered_run_records
  temporary_report_dirs_allowed: false
  dated_archive_subdirs_required: true
  archive_reports_are_active_evidence_by_default: false
  safety_rules:
    - move_historical_reports_to_docs_reports_archive_YYYYMMDD
    - cite_archived_reports_from_pipeline_docs_or_registry
    - keep_raw_tmp_reports_out_of_default_handoff

implementation_surface_policy:
  package_root: ecg_adv_gen
  tests_root: util/tests
  legacy_wrapper_roots:
    - scripts/paper
    - scripts/pgd_cross_center
    - scripts/triple_labels
    - scripts/ecgtwin_author_repro
    - scripts/ecgtwin_gen
  new_shared_logic_target: ecg_adv_gen
  legacy_entrypoints_can_move_without_index_update: false
  legacy_wrappers_own_new_shared_abstractions: false
  package_helpers_require_cpu_tests: true
  safety_rules:
    - extract_small_cpu_tested_helpers_before_training_loop_moves
    - keep_script_level_compatibility_exports
    - update_active_scripts_and_tests_with_entrypoint_moves
    - do_not_move_full_gpu_orchestration_in_one_step

launcher:
  script: scripts/run_experiment.py
  config_package: ecg_adv_gen/config
  mode:
    dry_run: supported
    execute: supported_with_gpu_safety_gates
  launch_artifacts:
    - run_config.resolved.yaml
    - run_config.resolved.json
    - run_manifest.json
    - command.sh
    - data_manifest.json
    - k500_ref_ids.json
    - selection.json
    - run_card.json
    - run_file_index.json
    - summary.md
  content_checks:
    - eval_result_mapping_metadata
    - k500_ref_ids_integrity
    - selection_policy_record
    - optional_required_epoch_metrics_in_training_log
    - run_id_scoped_child_and_postprocess_outputs
  execution_logs:
    - logs/command_XX.log
    - logs/command_XX.stdout.log
    - logs/command_XX.stderr.log
    - logs/postprocess_XX.log
    - logs/postprocess_XX.stdout.log
    - logs/postprocess_XX.stderr.log
    - stdout.log
    - stderr.log
  postprocess:
    status: supported_for_reporting_exports
    allowlist:
      - scripts/export_data_manifest.py
      - scripts/export_metrics_long.py
      - scripts/merge_metrics_long.py
      - scripts/export_paper_table.py

run_record_layout:
  status: active
  required_files:
    - run_card.json
    - run_file_index.json
    - summary.md
  required_directories:
    - configs/
    - manifests/
    - logs/
    - checkpoints/
    - eval/
    - diagnostics/
    - reports/
    - artifacts/

evidence_scope_definitions:
  trusted_registry_linked: Launch config is linked to the current trusted active evidence, but cite metrics only through configs/active_evidence_registry.yaml and recorded artifacts.
  launch_only: Launch surface is managed and auditable, but it is not current experiment evidence by itself.
  prep_only: Preparation/export surface only; generated data must be linked by later run manifests before citation.
  evaluation_only: Evaluation surface only; cite resulting metrics only after registry or run-record registration.

