  - configs/experiments
  tracked_yaml_required: true
  new_long_bash_launchers_allowed: false
  new_dated_matrix_scripts_allowed: false
  human_exception_requires_index_update: true
  gpu_binding_location: external_environment_after_nvidia_smi
  archived_bash_role: provenance_only_not_callable_interface
