schema_version: 2
updated: 2026-09-01
purpose: >
  Declare the executable surface of the clean-room manual refactor. Paths not
  owned by the keep manifest are not active runtime dependencies.

source_of_truth:
  shared_server_safety: AGENTS.md
  keep_manifest: docs/refactor_cleanup/manual_refactor_keep_manifest.md
  evidence_registry: configs/active_evidence_registry.yaml
  launcher: boot_scripts/run_experiment.py
  config_contract: configs/README.md

launch_surface_policy:
  default_launcher: boot_scripts/run_experiment.py
  retained_entrypoints:
    - pulse_hybrid
    - evaluate_pulse_subset
    - profile_pulse_adapters
    - evaluate_pulse_adapters
    - train_ecg_image
    - coordinate_pulse_training
    - train_ptbxl_effnet
    - train_ptbxl_ecgfounder
    - train_pn2021
    - evaluate_pn2021
    - aggregate_pn2021
    - evaluate_ecg_image
    - report_ecg_image
  config_root: configs
  tracked_yaml_required: true
  run_scoped_output_required: true
  output_must_be_outside_worktree: true
  gpu_binding: external_environment_after_nvidia_smi
  legacy_runtime_imports_allowed: false
  dynamic_python_imports_from_yaml_allowed: false
  runtime_roots:
    - boot_scripts
    - core
    - data_preprocess
    - models
    - util
  safety_rules:
    - no_tracked_gpu_ids
    - no_system_environment_changes
    - no_implicit_overwrite
    - no_agent_workspace_runtime_import

