schema_version: 2
profile_name: pn2021_k500_data_interface_handoff

# This file is a portable handoff contract, not a second split generator.
# Runtime data, caches, frozen ID arrays, and weights stay outside Git.
# The handoff archive supplies split IDs and weights; waveform caches are
# supplied separately through get_dataloader(..., cache_dir=..., split_dir=...).
interface:
  module: data_preprocess.data_runtime
  loader: get_dataloader
  evaluation_session: SequentialEvaluationDataSession
  selection_identity: ECGSelection.describe
  canonical_raw_request:
    sampling_rate_hz: 100
    prepare_for_model: false
    sanitize: false
    global_zscore: false
    output_layout: time_channel
    shuffle: false
  canonical_raw_output:
    signal_shape: [1000, 12]
    signal_dtype: float32
    physical_unit: mV
    label_shape: [5]
    class_order: [CD, HYP, MI, NORM, STTC]

