schema_version: 2
profile_name: pn2021_k500_data_interface_handoff

# This file is a portable handoff contract, not a second split generator.
# Runtime data, caches and ID arrays stay outside Git and are supplied through
# the tracked split/cache configs consumed by finite loader plans.
interface:
  module: data_preprocess.data_runtime
  internal_builder: _build_runtime_loader
  public_loader_plans:
    ptbxl_source:
      class: PTBXLLoaderPlan
      openings: [open_train, open_validation, open_test]
      shuffle_by_opening:
        open_train: true
        open_validation: false
        open_test: false
    pn2021_k500:
      class: PN2021K500LoaderPlan
      openings: [open_ordered, open_training]
      shuffle_by_opening:
        open_ordered: false
        open_training: true
      partition: k500
      exact_record_count: 500
      drop_last: false
    pn2021_evaluation:
      class: PN2021EvaluationLoaderPlan
      openings: [open_clean, open_corrupted, open_session]
      shuffle_by_opening:
        open_clean: false
        open_corrupted: false
        open_session: false
      session_class: SequentialEvaluationDataSession
      ref_excluded_only: true
  dynamic_generic_loader_public: false
  data_content_verifier:
    module: data_preprocess.data_ledger
    callable: verify_ledger
    managed_execution_mode: quick_exact_inventory_and_size
    offline_seal_mode: full_content
  selection_identity: ECGSelection.describe
  canonical_raw_request:
    sampling_rate_hz: 100
    prepare_for_model: false
    sanitize: false
    global_zscore: false
    output_layout: time_channel
  canonical_raw_output:
    signal_shape: [1000, 12]
    signal_dtype: float32
    physical_unit: mV
    label_shape: [5]
    class_order: [CD, HYP, MI, NORM, STTC]

