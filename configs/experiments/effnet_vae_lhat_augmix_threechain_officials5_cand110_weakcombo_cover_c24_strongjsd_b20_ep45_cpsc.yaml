extends:
  - effnet_vae_lhat_augmix_threechain_officials5_cand107_triplecover_c24_strongjsd_b20_ep45_cpsc.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_officials5_cand110_weakcombo_cover_c24_strongjsd_b20_ep45_cpsc
  description: "CPSC pilot: c107 strong training with operator cycle optimized toward weakest depth-3 recovery combos."

adaptation:
  run_tag_extra: c110officials5_weakcombo_cover_c24_strongjsd_b20_ep45
  latent_augmix:
    ops:
      - random_leads_masking
      - emg_noise
      - powerline_noise
      - random_leads_masking
      - baseline_wander
      - baseline_shift
      - random_leads_masking
      - baseline_wander
      - emg_noise
      - baseline_shift
      - powerline_noise
      - emg_noise
      - baseline_wander
      - baseline_shift
      - random_leads_masking
      - powerline_noise
      - baseline_wander
      - emg_noise
      - powerline_noise
      - baseline_wander
      - baseline_shift

run_record:
  purpose: >-
    Test whether c107's residual depth-3 gap comes from undertraining the
    weakest recovered combinations: baseline_wander+emg_noise+powerline_noise,
    baseline_shift+baseline_wander+powerline_noise,
    baseline_shift+baseline_wander+random_leads_masking, and related masking
    triples. The operator cycle was generated to cover all ten official
    triples while oversampling the weakest c107 recovery windows. This keeps
    the VAE-LH + locked three-chain AugMix paradigm and does not add a
    stabilizer, oracle, single-chain AugMix, or raw-supervised branch.
  result_summary: Pending.
  registration_status: provisional
