extends:
  - ecgfounder_inithead_fullft_k500_v6.yaml

experiment:
  name: ecgfounder_inithead_fullft_k500_v6_smoke
  description: Short execute-smoke for ECGFounder initialized-head full fine-tuning wrapper.
  status: smoke-only

data:
  cache:
    ecgfounder_fullft_signal_cache_dir: ${paths.data_root}/paper_ecgfounder_fullft_signal_cache_union_20260528/cache

training:
  epochs: 1
  batch_size: 32
  eval_batch_size: 64
  num_workers: 0
  source_train_limit: 64
  optimizer:
    lr: 0.00002
    weight_decay: 0.0001

runner:
  argv:
    - --out_dir
    - ${paths.output_root}/${experiment.name}/${runtime.run_id}
    - --center
    - ${matrix.center}
    - --ref_meta_json
    - ${paths.data_root}/paper_vae_only_latenthull_sweep_20260516/subsets/${matrix.center}/k${paper_protocol.kshot.k}_seed${paper_protocol.kshot.seed}/${matrix.center}_real_k${paper_protocol.kshot.k}_seed${paper_protocol.kshot.seed}.ref_meta.json
    - --k
    - ${paper_protocol.kshot.k}
    - --epochs
    - ${training.epochs}
    - --seed
    - ${paper_protocol.kshot.seed}
    - --device
    - cuda
    - --num_workers
    - ${training.num_workers}
    - --batch_size
    - ${training.batch_size}
    - --eval_batch_size
    - ${training.eval_batch_size}
    - --lr
    - ${training.optimizer.lr}
    - --weight_decay
    - ${training.optimizer.weight_decay}
    - --source_train_limit
    - ${training.source_train_limit}
    - --cache_dir
    - ${data.cache.ecgfounder_fullft_signal_cache_dir}
    - --init_head_path
    - ${paths.data_root}/paper_foundation_baselines_20260524/ecgfounder_kshot_head_ft_v6_from_legacy_cache/runs/${matrix.center}_K${paper_protocol.kshot.k}_fromK${paper_protocol.kshot.k}_headft_ep50_seed${paper_protocol.kshot.seed}/best_head.pt
    - --target_val_count
    - 20
    - --target_val_seed
    - ${paper_protocol.kshot.seed}
    - --selection_metric
    - source_plus_target_val_auprc
    - --run_name
    - ${matrix.center}_smoke_inithead_fullft_ep${training.epochs}
