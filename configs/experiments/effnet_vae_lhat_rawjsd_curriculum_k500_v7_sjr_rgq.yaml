extends:
  - effnet_vae_lhat_k500_v7_sjr_rgq.yaml

experiment:
  name: effnet_vae_lhat_rawjsd_curriculum_k500_v7_sjr_rgq
  description: EfficientNet1DV2 K500 VAE-LHAT with explicit raw PN2021-C stressor consistency using JSD, adapted from the strongest historical raw-corruption candidate.

paper_protocol:
  kshot:
    seed: 20260601
    subset_seed: 20260601

model:
  direct_init_root: ${paths.output_root}/effnet_direct_k500_v7_sjr_rgq/seed20260601_k500_v7_sjr_rgq_20260530_rep1/runs

adaptation:
  run_tag_extra: k500_rawjsd
  latent_augmix:
    latent_weight_cap: 0.2
    width: 3
    depth: 1
    alpha: 1.0
    severity: 4
    ops:
      - powerline_noise
      - emg_noise
      - baseline_wander
      - baseline_shift
      - random_leads_masking
  raw_corrupt_consistency:
    enabled: true
    copies: 2
    prob: 0.75
    severity: 5
    severity_profile: standard
    ops:
      - baseline_shift
      - random_leads_masking
      - baseline_shift
      - random_leads_masking
      - powerline_noise
      - emg_noise
      - baseline_wander
    consistency_weight: 8.0
    consistency_loss: jsd
    bce_weight: 0.05
    max_batches: 8
    scope: target
    no_renorm: true
    clip_abs: 6.0

run_record:
  purpose: Test a managed raw-corruption curriculum branch for recovering calibrated PN2021-C AUPRC drop.
  result_summary: Pending. Compare against matched VAE noAug under calibrated_10to20pp PN2021-C without heldout-oracle model selection.
  registration_status: provisional
