extends:
  - pn2021c_official_s5_locked_protocol.yaml

experiment:
  name: pn2021c_effnet_dual3ch_cand30_cand32_rawfirst_missing3
  description: Raw-first dual-model PN2021-C evaluation for cand30/cand32 q2048 EfficientNet VAE-LH AugMix candidates on the three non-CPSC centers.

paper_protocol:
  kshot:
    seed: 20260601
    subset_seed: 20260601

evaluation:
  severity_profile: custom
  severity_params_file: configs/corruption_profiles/pn2021c_dual_model_10to15pp_v1.yaml
  severity_params_name: dual_model_10to15pp_v1
  severities: [5]
  corruption_input: raw_first
  output_stem: eval_pn2021_c_v7_refexcluded_stream_dual_model_10to15pp_v1_raw_first

logging:
  child_artifacts:
    - eval_pn2021_c_v7_refexcluded_stream_dual_model_10to15pp_v1_raw_first.json
  postprocess_artifacts:
    - pn2021c_effnet_dual3ch_cand30_cand32_rawfirst_missing3.csv

runner:
  matrix:
    center:
      - ningbo
      - chapman_shaoxing
      - georgia
    method:
