      - name: cand32_q2048_lfmask_focus
        family: effnet_vae_lhat_augmix_threechain_dualmodel_cand32_q2048_lfmask_focus_missing3
        model_dir_template: >-
          {output_root}/effnet_vae_lhat_augmix_threechain_dualmodel_cand32_q2048_lfmask_focus_missing3/dual3ch_cand32_q2048_lfmask_focus_missing3_20260620/{center}_realall_targetheavy_M20_lam0p2_augmix_s5_wlat0p3_hs10_target_macro_auprc_cdhypminormsttc_hlabelcom_anchor_soft_sta_local_random_p120_fullft_trraw_proxy_q2048r1_lfmask_c8_rawfocus_aw16_tw55_hs10_lam20_cw20_b7_ep30_seed20260601
