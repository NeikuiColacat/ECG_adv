extends:
  - effnet_vae_lhat_augmix_threechain_dualmodel_cand31_q2048_bufferdominant_cpsc.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_dualmodel_cand36_q2048_hardop_inclusive_cpsc
  description: "CPSC probe: keep cand31 q2048 buffer-dominant pressure and locked three-chain topology, but include all hard operators with doubled powerline, EMG, and lead-masking exposure."

adaptation:
  run_tag_extra: trraw_proxy_q2048r1_hardopinc_aw24_tw45_hs10_lam20_c6_cw16_b6
  latent_augmix:
    copies: 6
    chain_weights: "0.45,0.45,0.10"
    ops:
      - powerline_noise
      - powerline_noise
      - emg_noise
      - emg_noise
      - baseline_wander
      - baseline_shift
      - random_leads_masking
      - random_leads_masking
    consistency:
      enabled: true
      consistency_weight: 16.0
      consistency_loss: jsd
      bce_weight: 6.0
      max_batches: 0

run_record:
  purpose: Test whether cand35 lost recovery by removing EMG while over-weighting generic hard exposure; this keeps cand31 pressure fixed and changes only the hard-operator exposure mix inside locked three-chain VAE-LH AugMix.
  result_summary: Pending.
  registration_status: provisional
