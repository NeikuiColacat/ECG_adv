extends:
  - effnet_vae_lhat_augmix_threechain_dualmodel_k500_cpsc_base.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_dualmodel_cpsc_advheavy_hlam20_aw3p0_c4_cw10_bce3_m090
  description: "CPSC dual_model adversarial-pressure candidate: stronger VAE-LH search, adv weight 3.0, reduced clean target dominance, copies4, JSD10/BCE3."

training:
  batch_size: 80

adaptation:
  run_tag_extra: k500_dual3ch_advheavy_hlam20_hs8_lr50_c4_cw10_bce3_m090_aw3p0_ka1800_treal40
  anchors:
    k_anchor: 1800
  hull:
    lambda: 0.20
    steps: 8
    lr: 0.50
  loss:
    target_real_weight: 40.0
    adv_weight: 3.0
    adv_weight_warmup_epochs: 1
  latent_augmix:
    copies: 4
    latent_weight_cap: 0.50
    depth: 1
    mixture:
      mode: fixed
      prob: 0.90
    consistency:
      enabled: true
      consistency_weight: 10.0
      consistency_loss: jsd
      bce_weight: 3.0
      max_batches: 0

run_record:
  purpose: Test whether maintaining harder VAE-LH adversarial pressure, rather than only adding more AugMix copies, can approach 10 pp PN2021-C recovery.
  result_summary: Pending.
  registration_status: provisional
