extends:
  - effnet_vae_lhat_augmix_threechain_dualmodel_k500_cpsc_base.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_dualmodel_cand12_rawspace_advbce
  description: "Four-center EfficientNet VAE-LHAT locked three-chain AugMix candidate: apply PN2021-C ops in raw-pre-zscore VAE decode space with stronger adversarial-chain and supervised AugMix BCE pressure."

training:
  batch_size: 64
  num_workers: 8

adaptation:
  run_tag_extra: rawspace_c5_w353530_cw8_b8_aw3
  anchors:
    k_anchor: 1800
  hull:
    lambda: 0.15
    steps: 8
    lr: 0.45
  loss:
    target_real_weight: 45.0
    adv_weight: 3.0
    adv_weight_warmup_epochs: 1
  latent_augmix:
    copies: 5
    latent_weight_cap: 0.30
    depth: 1
    signal_space: raw_pre_zscore
    op_schedule: per_op
    chain_weights: "0.35,0.35,0.30"
    mixture:
      mode: fixed
      prob: 1.0
    consistency:
      enabled: true
      consistency_weight: 8.0
      consistency_loss: jsd
      bce_weight: 8.0
      max_batches: 0

runner:
  matrix:
    center:
      - ningbo
      - chapman_shaoxing
      - cpsc_2018
      - georgia

run_record:
  purpose: Test whether aligning locked three-chain AugMix corruption input space with PN2021-C raw-first evaluation plus stronger VAE adversarial-chain/BCE pressure can move recovery toward +10pp without adding a separate raw corruption branch or stabilizer.
  result_summary: Pending.
  registration_status: provisional
