extends:
  - effnet_vae_lhat_augmix_threechain_dualmodel_cand94_q8192_hull24_perop_maskpower_c15_b20_ep45_cpsc.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_dualmodel_cand96_q8192_hull24_balancemask_c18_b24_ep36_cpsc
  description: "CPSC fallback: balanced per-op locked three-chain AugMix with extra random-lead and baseline exposure."

training:
  epochs: 36
  batch_size: 24
  num_workers: 6

adaptation:
  run_tag_extra: c96balmask_c18_b24_ep36
  latent_augmix:
    copies: 18
    depth: 1
    op_schedule: per_op
    chain_weights: "0.45,0.45,0.10"
    ops:
      - random_leads_masking
      - baseline_shift
      - baseline_wander
      - random_leads_masking
      - emg_noise
      - baseline_shift
      - random_leads_masking
      - baseline_wander
      - powerline_noise
      - random_leads_masking
      - baseline_shift
      - emg_noise
      - random_leads_masking
      - baseline_wander
      - baseline_shift
      - powerline_noise
      - random_leads_masking
      - baseline_wander
    consistency:
      enabled: true
      consistency_weight: 14.0
      consistency_loss: jsd
      bce_weight: 8.0
      max_batches: 0

run_record:
  purpose: >-
    Fallback candidate if cand94 stays below the +10 pp recovery gate. Cand93
    and earlier completed snapshots showed random_leads_masking as the weakest
    operator, with baseline_shift/baseline_wander still below target while
    powerline was already near target. This keeps the VAE-LH hard-sample
    search and locked three-chain AugMix topology, shifts the two raw ECG
    corruption chains toward mask plus baseline views, and keeps the VAE-LH
    adversarial waveform chain inside AugMix rather than adding a separate
    raw-supervised branch or preprocessing stabilizer.
  result_summary: Pending.
  registration_status: provisional
