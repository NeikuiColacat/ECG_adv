extends:
  - ecgfounder_vae_lhat_augmix_threechain_locked_k500.yaml

experiment:
  name: ecgfounder_vae_lhat_augmix_threechain_cand93_matched_seed20260601_k500
  description: ECGFounder fullFT VAE-LH plus locked three-chain AugMix matched to EfficientNet cand93 depth-2 composite recipe.

paper_protocol:
  kshot:
    seed: 20260601
    subset_seed: 20260601

model:
  upstream_run_id: seed20260601_locked_rawfirst_20260622
  init_model_path: ${paths.output_root}/ecgfounder_k500_fullft_locked/seed20260601_locked_rawfirst_20260622/runs/${matrix.center}_k500_fullft_locked/last_model.pt

adaptation:
  run_name: ${matrix.center}_vae_lhat_augmix_threechain_cand93_matched_seed20260601
  latent_augmix:
    enabled: true
    topology: locked_three_chain
    copies: 12
    width: 3
    depth: 2
    alpha: 1.0
    severity: 5
    severity_profile: custom
    severity_params_file: configs/corruption_profiles/pn2021c_dual_model_10to15pp_train_proxy_v2.yaml
    severity_params_name: dual_model_10to15pp_train_proxy_v2
    mixture:
      mode: fixed
      prob: 1.0
      beta_a: 0.0
      beta_b: 0.0
    op_schedule: cycle
    chain_weights: 0.425,0.425,0.15
    ops:
      - random_leads_masking
      - powerline_noise
      - baseline_wander
      - random_leads_masking
      - emg_noise
      - powerline_noise
      - random_leads_masking
      - baseline_shift
      - powerline_noise
      - random_leads_masking
      - baseline_wander
      - emg_noise
    renorm: false
    clip_abs: 6.0

run_record:
  purpose: >-
    Matched ECGFounder replication of the EfficientNet cand93 recipe for the
    model-universality gate. It keeps VAE-LH online adversarial training plus
    locked three-chain AugMix, uses the seed20260601 K500 subset, and does not
    add stabilizer, repair frontend, raw-supervised branch, operator oracle, or
    heldout selector.
  result_summary: Pending.
  registration_status: provisional
