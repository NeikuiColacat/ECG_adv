extends:
  - ../defaults/common_v7_sjr_rgq_super5.yaml

experiment:
  name: ecgtwin_prompt_token_gate_minimal
  description: Managed minimal ECGTwin prompt-token gating/export launch surface for one generated target-center pool.
  status: active-wrapped

model:
  backbone: ecgtwin_prompt_token_gate
  name: ecgtwin_prompt_token_gate_minimal
  num_classes: 5

adaptation:
  method: ecgtwin_prompt_token_gate
  prompt_token:
    cache_root: ${paths.data_root}/ecgtwin_prompt_token_super5/cache_v1
    output_root: ${paths.output_root}/ecgtwin_prompt_token_minimal/${runtime.run_id}
    center: ningbo
    classes: [NORM, MI, STTC]
    arm: target_token
    selection_seed: 42
    min_target_prob: "0.30"
    min_pass_per_class: 1
    max_pass_per_class: 0
    fs: 102.4
    lead_order: mimic

logging:
  child_artifacts:
    - gated_samples.npz
    - gated_samples.latent.npz
    - gated_samples.class_trust.json
    - gated_samples.ref_meta.json
    - gate_report.json
  postprocess_artifacts: []

runner:
  entrypoint: scripts/ecgtwin_gen/gate_prompt_token_synth.py
  name: ${experiment.name}
  argv:
    - --input_dir
    - ${adaptation.prompt_token.output_root}/generated/${adaptation.prompt_token.arm}/${adaptation.prompt_token.center}
    - --out_dir
    - ${adaptation.prompt_token.output_root}/generated/${adaptation.prompt_token.arm}/${adaptation.prompt_token.center}/gated
    - --classes
    - ${adaptation.prompt_token.classes}
    - --fs
    - ${adaptation.prompt_token.fs}
    - --lead_order
    - ${adaptation.prompt_token.lead_order}
    - --min_target_prob
    - ${adaptation.prompt_token.min_target_prob}
    - --min_pass_per_class
    - ${adaptation.prompt_token.min_pass_per_class}
    - --max_pass_per_class
    - ${adaptation.prompt_token.max_pass_per_class}
    - --cache_root
    - ${adaptation.prompt_token.cache_root}
    - --K
    - ${paper_protocol.kshot.k}
    - --selection_seed
    - ${adaptation.prompt_token.selection_seed}

lineage:
  replaces_legacy_surface: scripts/ecgtwin_gen/run_center_token_effectiveness_pilot_20260503.sh
  scope: prompt_token_generation_gate_minimal
  prerequisite_stage: ecgtwin_prompt_token_generate_minimal
  notes:
    - This gate consumes the generated target-token pool for the same runtime.run_id and exports files compatible with synth_online_at_super5.py.
