extends:
  - pn2021c_effnet_v7_strong_10to20pp.yaml

experiment:
  name: pn2021c_effnet_v7_strong_calibrated_rawsupervised_ningbo
  description: Single-center calibrated 10-20 pp PN2021-C evaluation for calibrated-profile source-target raw stressor training against matched VAE noAug.

paper_protocol:
  kshot:
    seed: 20260601
    subset_seed: 20260601

training:
  num_workers: 0

runner:
  matrix:
    center:
      - ningbo
    method:
      - name: vae_noaug
        family: effnet_vae_noaug_k500_v7_sjr_rgq
        noaug_suffix: _noaugmix
        run_stamp: 20260530_rep1
        run_leaf_stem: realall_targetheavy_M20_lam0p05_augmix_s2_wlat0p25_hs3_target_macro_auprc_cdhypminormsttc_hlabelcom_anchor_soft_sta_local_random_p120
      - name: calrawsupervised_s5src_bce1_jsd2
        family: effnet_vae_lhat_calibrated_rawsupervised_k500_v7_sjr_rgq_ningbo
        noaug_suffix: _calrawsupervised
        run_stamp: 20260614_calrawsupervised_ningbo
        run_leaf_stem: realall_targetheavy_M20_lam0p05_augmix_s2_wlat0p25_hs3_target_macro_auprc_cdhypminormsttc_hlabelcom_anchor_soft_sta_local_random_p120

run_record:
  purpose: Evaluate whether calibrated-profile source-target raw stressor training recovers calibrated PN2021-C corrupted AUPRC on Ningbo.
  result_summary: Pending. If Ningbo recovery remains far below +6 pp AUPRC, do not expand this exact recipe to four centers.
  registration_status: provisional
