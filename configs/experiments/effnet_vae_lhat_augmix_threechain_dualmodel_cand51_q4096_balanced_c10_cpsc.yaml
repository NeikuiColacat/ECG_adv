  latent_augmix:
    copies: 10
    chain_weights: "0.45,0.45,0.10"
    ops:
      - powerline_noise
      - emg_noise
      - baseline_wander
      - baseline_shift
      - random_leads_masking
      - powerline_noise
      - emg_noise
      - baseline_wander
      - baseline_shift
      - random_leads_masking
    consistency:
      enabled: true
      consistency_weight: 16.0
      consistency_loss: jsd
      bce_weight: 6.0
      max_batches: 0

run_record:
