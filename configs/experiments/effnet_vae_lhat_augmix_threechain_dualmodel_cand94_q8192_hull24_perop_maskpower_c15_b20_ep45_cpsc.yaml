extends:
  - effnet_vae_lhat_augmix_threechain_dualmodel_cand93_q8192_hull24_combo_depth2_c12_b24_ep45_cpsc.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_dualmodel_cand94_q8192_hull24_perop_maskpower_c15_b20_ep45_cpsc
  description: "CPSC probe: per-operator locked three-chain AugMix exposure, biased toward random-lead masking and powerline."

training:
  epochs: 45
  batch_size: 20
  num_workers: 4

adaptation:
  run_tag_extra: c94perop_c15_maskpower_aw24_b20_ep45
  latent_augmix:
    copies: 15
    depth: 1
    op_schedule: per_op
    chain_weights: "0.425,0.425,0.15"
    ops:
      - random_leads_masking
      - powerline_noise
      - random_leads_masking
      - baseline_wander
      - powerline_noise
      - random_leads_masking
      - baseline_shift
      - emg_noise
      - powerline_noise
      - random_leads_masking
      - baseline_wander
      - baseline_shift
      - powerline_noise
      - random_leads_masking
      - emg_noise

run_record:
  purpose: >-
    Test whether cand93's composite depth-2 raw chains are still undertraining
    the single-operator PN2021-C evaluation distribution. This keeps the locked
    three-chain VAE-LH + AugMix topology and the adversarial waveform chain,
    but maps each AugMix copy to one operator with extra random-lead masking
    and powerline exposure, avoiding a separate raw-supervised branch.
  result_summary: Pending.
  registration_status: provisional
