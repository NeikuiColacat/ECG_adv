extends: benchmark_fcn_wang_vae_lhat_k500_v7_sjr_rgq.yaml

experiment:
  name: benchmark_fcn_wang_vae_noaug_k500_v7_sjr_rgq
  description: Benchmark FCN-Wang K500 VAE-LHAT v7 SJR/RGQ noAug matrix launch surface consuming same-run direct K500 checkpoints.

model:
  output_family: benchmark_fcn_wang_vae_noaug_k500_v7_sjr_rgq

adaptation:
  method: benchmark_vae_latent_hull_online_at_noaug_v7
  latent_augmix:
    enabled: false

lineage:
  scope: benchmark_fcn_wang_vae_noaug_k500_only
  prerequisite_stage: benchmark_fcn_wang_direct_k500_v7_sjr_rgq_matrix
  notes:
    - This noAug managed config disables the latent AugMix branch while keeping the same VAE-LHAT latent-hull recipe.
    - It writes to a separate output family and consumes same-run Direct K500 checkpoints for strict ablation comparability.
