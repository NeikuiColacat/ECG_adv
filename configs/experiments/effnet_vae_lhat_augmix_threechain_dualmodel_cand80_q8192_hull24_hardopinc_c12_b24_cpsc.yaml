extends:
  - effnet_vae_lhat_augmix_threechain_dualmodel_cand72_q8192_hull24_c10_maskboost_b32_cpsc.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_dualmodel_cand80_q8192_hull24_hardopinc_c12_b24_cpsc
  description: "CPSC probe: combine cand72 q8192/hull24 with hard-operator-inclusive noise/mask exposure from earlier high-EMG candidates."

training:
  batch_size: 24
  num_workers: 6

adaptation:
  run_tag_extra: trraw_proxy16_q8192r1_hardopinc_c12_aw24_tw45_hs12_lam24_c12_cw16_b6_b24
  latent_augmix:
    copies: 12
    chain_weights: "0.45,0.45,0.10"
    ops:
      - powerline_noise
      - emg_noise
      - random_leads_masking
      - powerline_noise
      - emg_noise
      - baseline_wander
      - random_leads_masking
      - baseline_shift
      - powerline_noise
      - emg_noise
      - baseline_wander
      - random_leads_masking

run_record:
  purpose: >-
    Test whether the CPSC ceiling after cand75 is caused by
    under-internalized EMG/noise views. cand42 had the best EMG recovery but
    poor mean, while cand75 had the best mean and powerline/mask recovery.
    This keeps q8192/hull24 VAE-LH hard-sample search and locked three-chain
    AugMix without preprocessing, heldout selection, or a standalone
    raw-supervised branch.
  result_summary: Pending.
  registration_status: provisional
