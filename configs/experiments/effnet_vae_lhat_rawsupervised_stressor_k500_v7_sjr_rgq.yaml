extends:
  - effnet_vae_lhat_k500_v7_sjr_rgq.yaml

experiment:
  name: effnet_vae_lhat_rawsupervised_stressor_k500_v7_sjr_rgq
  description: EfficientNet1DV2 K500 VAE-LHAT with source-target supervised raw PN2021-C stressor training.

paper_protocol:
  kshot:
    seed: 20260601
    subset_seed: 20260601

model:
  direct_init_root: ${paths.output_root}/effnet_direct_k500_v7_sjr_rgq/seed20260601_k500_v7_sjr_rgq_20260530_rep1/runs

adaptation:
  run_tag_extra: k500_rawsupervised
  raw_corrupt_consistency:
    enabled: true
    copies: 2
    prob: 1.0
    severity: 5
    severity_profile: standard
    ops:
      - powerline_noise
      - emg_noise
      - baseline_wander
      - baseline_shift
      - random_leads_masking
    consistency_weight: 2.0
    consistency_loss: jsd
    bce_weight: 1.0
    max_batches: 64
    scope: source_target
    no_renorm: true
    clip_abs: 6.0

run_record:
  purpose: Test whether explicit supervised source-target raw stressor training can recover calibrated PN2021-C AUPRC beyond target-only consistency.
  result_summary: Pending. Compare against matched VAE noAug under calibrated_10to20pp PN2021-C without heldout-oracle model selection.
  registration_status: provisional
