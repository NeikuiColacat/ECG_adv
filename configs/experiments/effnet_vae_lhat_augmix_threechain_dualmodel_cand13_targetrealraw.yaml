extends:
  - effnet_vae_lhat_augmix_threechain_dualmodel_k500_cpsc_base.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_dualmodel_cand13_targetrealraw
  description: "Four-center EfficientNet VAE-LHAT locked three-chain AugMix candidate: use real K500 raw ECG as the two corruption-chain anchors and keep the VAE-LH adversarial waveform as the third chain."

training:
  batch_size: 64
  num_workers: 8

adaptation:
  run_tag_extra: trraw_c5_w4510_cw12_b8_aw3
  anchors:
    k_anchor: 1800
  hull:
    lambda: 0.15
    steps: 8
    lr: 0.45
  loss:
    target_real_weight: 45.0
    adv_weight: 3.0
    adv_weight_warmup_epochs: 1
  latent_augmix:
    copies: 5
    latent_weight_cap: 0.30
    depth: 1
    signal_space: raw_pre_zscore
    corruption_source: target_real
    op_schedule: per_op
    chain_weights: "0.45,0.45,0.10"
    mixture:
      mode: fixed
      prob: 1.0
    consistency:
      enabled: true
      consistency_weight: 12.0
      consistency_loss: jsd
      bce_weight: 8.0
      max_batches: 0

runner:
  matrix:
    center:
      - ningbo
      - chapman_shaoxing
      - cpsc_2018
      - georgia

run_record:
  purpose: Test whether moving the locked three-chain raw corruption chains from VAE-decoded anchors to real K500 raw ECG anchors improves transfer to PN2021-C raw-first corruptions while keeping the VAE-LH adversarial waveform as the third AugMix chain.
  result_summary: Pending.
  registration_status: provisional
