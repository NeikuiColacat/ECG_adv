extends:
  - ../defaults/common_v7_sjr_rgq_super5.yaml

experiment:
  name: ecgtwin_author_dit_repro
  description: Managed ECGTwin author DiT stage-2 reproduction launch surface consuming the managed IBE stage from the same run id.
  status: active-wrapped

training:
  epochs: 30
  batch_size: 512
  val_batch_size: 512
  num_workers: ${resources.default_num_workers}
  prefetch_factor: 2
  matmul_precision: high
  amp:
    enabled: true
    dtype: bf16
  log_every: 20

model:
  backbone: ecgtwin_author_dit_repro
  name: ecgtwin_author_dit_repro
  num_classes: 5

adaptation:
  method: ecgtwin_author_dit_stage2_reproduction

logging:
  child_artifacts:
    - train.log
    - run_config.yaml
    - metrics.jsonl
    - loss_curve.csv
    - loss_curve.png
    - checkpoints/latest.pt
    - checkpoints/best_val.pt
    - checkpoints/best_train.pt
    - checkpoints/DiT_ECGTwin_latest.pth
    - checkpoints/DiT_ECGTwin_best_val.pth
    - checkpoints/DiT_ECGTwin_best_train.pth
  postprocess_artifacts: []

runner:
  entrypoint: scripts/ecgtwin_author_repro/train_dit_repro.py
  name: ${experiment.name}
  argv:
    - --output_dir
    - ${paths.output_root}/ecgtwin_author_repro/${runtime.run_id}/dit_stage2
    - --train_path
    - ${paths.data_root}/ECGTwin_Data/paired_Mimic_vae_multi_nomic.pt
    - --val_path
    - ${paths.data_root}/ECGTwin_Data/paired_Mimic_vae_multi_nomic_test.pt
    - --ibe_path
    - ${paths.output_root}/ecgtwin_author_repro/${runtime.run_id}/ibe_stage1/checkpoints/IBE_best.pth
    - --epochs
    - ${training.epochs}
    - --batch_size
    - ${training.batch_size}
    - --val_batch_size
    - ${training.val_batch_size}
    - --num_workers
    - ${training.num_workers}
    - --pin_memory
    - --prefetch_factor
    - ${training.prefetch_factor}
    - --amp
    - --amp_dtype
    - ${training.amp.dtype}
    - --matmul_precision
    - ${training.matmul_precision}
    - --device
    - cuda
    - --seed
    - ${paper_protocol.kshot.seed}
    - --log_every
    - ${training.log_every}

lineage:
  replaces_legacy_surface: scripts/ecgtwin_author_repro/run_author_repro_pipeline.sh
  scope: ecgtwin_author_dit_stage2_only
  prerequisite_stage: ecgtwin_author_ibe_repro
  notes:
    - The DiT stage must consume IBE_best.pth from the managed stage-1 output for the same runtime.run_id.
    - Persistent DataLoader workers are intentionally omitted because the historical long author run had worker cleanup issues after interruption.
