extends:
  - effnet_vae_lhat_augmix_threechain_dualmodel_k500_cpsc_base.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_dualmodel_cand11_opcycle_rawheavy
  description: "Four-center EfficientNet VAE-LHAT locked three-chain AugMix candidate: per-op operator-balanced copies with raw-heavy fixed chain weights for dual_model_10to15pp_v1 recovery."

training:
  batch_size: 64
  num_workers: 8

adaptation:
  run_tag_extra: opcyraw_c5_w4510_cw12_b4_m1
  anchors:
    k_anchor: 1600
  hull:
    lambda: 0.12
    steps: 6
    lr: 0.40
  loss:
    target_real_weight: 60.0
    adv_weight: 2.0
    adv_weight_warmup_epochs: 2
  latent_augmix:
    copies: 5
    latent_weight_cap: 0.10
    depth: 1
    op_schedule: per_op
    chain_weights: "0.45,0.45,0.10"
    mixture:
      mode: fixed
      prob: 1.0
    consistency:
      enabled: true
      consistency_weight: 12.0
      consistency_loss: jsd
      bce_weight: 4.0
      max_batches: 0

runner:
  matrix:
    center:
      - ningbo
      - chapman_shaoxing
      - cpsc_2018
      - georgia

run_record:
  purpose: Test whether putting explicit per-operator PN2021-C views inside the locked three-chain VAE-LHAT AugMix graph can close the gap from ~+2pp to ~+10pp recovery without adding an independent raw-supervised branch.
  result_summary: Pending.
  registration_status: provisional
