extends:
  - effnet_vae_lhat_augmix_threechain_dualmodel_cand72_q8192_hull24_c10_maskboost_b32_cpsc.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_dualmodel_cand93_q8192_hull24_combo_depth2_c12_b24_ep45_cpsc
  description: "CPSC probe: use composite depth-2 locked three-chain AugMix to target mask/powerline recovery bottlenecks."

training:
  epochs: 45
  batch_size: 24
  num_workers: 4

adaptation:
  run_tag_extra: c93d2_c12_aw24_b24_ep45
  latent_augmix:
    copies: 12
    depth: 2
    op_schedule: cycle
    chain_weights: "0.425,0.425,0.15"
    ops:
      - random_leads_masking
      - powerline_noise
      - baseline_wander
      - random_leads_masking
      - emg_noise
      - powerline_noise
      - random_leads_masking
      - baseline_shift
      - powerline_noise
      - random_leads_masking
      - baseline_wander
      - emg_noise

run_record:
  purpose: >-
    Test whether the current +6-8 pp recovery ceiling is caused by single-op
    raw chains. This keeps the VAE-LH hard-sample search and locked
    three-chain topology, but changes the two raw ECG corruption chains from
    single-op views to depth-2 composite views so random lead masking is
    learned together with powerline, baseline, and EMG stressors.
  result_summary: Pending.
  registration_status: provisional
