extends:
  - ../defaults/ecgfounder_v7_sjr_rgq_defaults.yaml
  - ../defaults/vae_lhat_defaults.yaml

experiment:
  name: ecgfounder_vae_lhat_k500_v7_sjr_rgq
  description: ECGFounder residual-adapter K500 VAE-LHAT v7 SJR/RGQ launch surface using v7 direct heads and seed20260531 ref-excluded subsets.

training:
  epochs: 20
  eval_every: 1
  batch_size: 1024
  eval_batch_size: 4096
  optimizer:
    name: adamw
    lr: 0.0005
    weight_decay: 0.0001

adaptation:
  method: ecgfounder_vae_latent_hull_online_at_v7
  anchors:
    k_anchor: 300
    sample_mode: hard_bce
    sample_power: 1.5
    sample_min_weight: 0.0001
    base_root: ${data.kshot_subset_root}
  hull:
    M: 20
    lambda: 0.15
    steps: 5
    lr: 0.25
    weight_mode: optimized
    dirichlet_alpha: 1.0
    include_anchor: true
    label_mode: primary
    mix_label_mode: anchor
    label_lambda_y: 0.5
    label_positive: 0.95
    label_negative_floor: 0.0
    label_new_class_cap: 0.5
  attack:
    pgd_eps: 2.0
    pgd_batch: 16
    attack_success_margin: 0.0001
  ecgfounder:
    head_type: residual_adapter
    adapter_hidden: 128
    adapter_dropout: 0.0
    adapter_scale: 1.0
    freeze_base_head: true
  loss:
    source_weight: 1.0
    target_real_weight: 120.0
    adv_weight: 80.0
    source_logit_anchor_weight: 0.0
    target_logit_anchor_weight: 0.0
  selection:
    metric: target_auprc
    source: target_real_val
    target_real_val_fraction: 0.2
    source_selection_weight: 0.25
    source_auprc_floor: 0.79
    source_floor_penalty: 5.0

logging:
  required_epoch_metrics:
    - epoch
    - train_loss
    - adv_weight_effective
    - attack_success.success_rate
    - attack_success.loss_gain_mean
    - attack_vs_anchor.success_rate
    - attack_vs_anchor.loss_gain_mean
    - target_val_macro_auprc
    - ptbxl_macro_auprc
    - selection_score
    - best_update
  child_artifacts:
    - best_head.pt
    - initial_head.pt
    - training_log.json
    - eval_result.json
  postprocess_artifacts:
    - metrics_long.csv
    - paper_table.csv

postprocess:
  commands:
    - name: export_metrics_long
      entrypoint: scripts/export_metrics_long.py
      env:
        TMPDIR: ${paths.short_tmp_root}
        XDG_CACHE_HOME: ${paths.cache_root}
      argv:
        - --input
        - ${paths.output_root}/${experiment.name}/${runtime.run_id}
        - --output-dir
        - ${paths.output_root}/metrics_export/${runtime.run_id}_${experiment.name}
        - --run-id
        - ${experiment.name}
        - --filter-to-target-center
        - --target-centers
        - ${paper_protocol.centers.target_4}
        - --expected-mapping-version
        - ${paper_protocol.mapping_version}
        - --expected-mapping-hash
        - ${paper_protocol.mapping_hash}
      expected_artifacts:
        - role: metrics_long
          path: ${paths.output_root}/metrics_export/${runtime.run_id}_${experiment.name}/metrics_long.csv
        - role: artifact_manifest
          path: ${paths.output_root}/metrics_export/${runtime.run_id}_${experiment.name}/artifact_manifest.json

    - name: export_paper_table_all_zero_kept
      entrypoint: scripts/export_paper_table.py
      env:
        TMPDIR: ${paths.short_tmp_root}
        XDG_CACHE_HOME: ${paths.cache_root}
      argv:
        - --metrics-long
        - ${paths.output_root}/metrics_export/${runtime.run_id}_${experiment.name}/metrics_long.csv
        - --output-dir
        - ${paths.output_root}/paper_table/${runtime.run_id}_${experiment.name}_all_zero_kept
        - --view
        - pn2021_all_zero_kept_refexcluded
        - --dataset
        - pn2021
        - --centers
        - ${paper_protocol.centers.target_4}
        - --no-dataset-rows
      expected_artifacts:
        - role: paper_table
          path: ${paths.output_root}/paper_table/${runtime.run_id}_${experiment.name}_all_zero_kept/paper_table.csv
        - role: paper_table_manifest
          path: ${paths.output_root}/paper_table/${runtime.run_id}_${experiment.name}_all_zero_kept/paper_table_manifest.json

    - name: export_paper_table_drop_all_zero
      entrypoint: scripts/export_paper_table.py
      env:
        TMPDIR: ${paths.short_tmp_root}
        XDG_CACHE_HOME: ${paths.cache_root}
      argv:
        - --metrics-long
        - ${paths.output_root}/metrics_export/${runtime.run_id}_${experiment.name}/metrics_long.csv
        - --output-dir
        - ${paths.output_root}/paper_table/${runtime.run_id}_${experiment.name}_drop_all_zero
        - --view
        - pn2021_drop_all_zero_refexcluded
        - --dataset
        - pn2021
        - --centers
        - ${paper_protocol.centers.target_4}
        - --no-dataset-rows
      expected_artifacts:
        - role: paper_table
          path: ${paths.output_root}/paper_table/${runtime.run_id}_${experiment.name}_drop_all_zero/paper_table.csv
        - role: paper_table_manifest
          path: ${paths.output_root}/paper_table/${runtime.run_id}_${experiment.name}_drop_all_zero/paper_table_manifest.json

runner:
  entrypoint: scripts/paper/run_ecgfounder_vae_only_lhat_head_ft_20260523.py
  name: ${experiment.name}_${matrix.center}
  matrix:
    center: ${paper_protocol.centers.target_4}
  argv:
    - --centers
    - ${matrix.center}
    - --out_dir
    - ${paths.output_root}/${experiment.name}/${runtime.run_id}/${matrix.center}
    - --linear_probe_dir
    - ${model.linear_probe_dir}
    - --checkpoint
    - ${model.checkpoint}
    - --preprocess_policy
    - ${model.preprocess_policy}
    - --k
    - ${paper_protocol.kshot.k}
    - --k_anchor
    - ${adaptation.anchors.k_anchor}
    - --anchor_sample_mode
    - ${adaptation.anchors.sample_mode}
    - --anchor_sample_power
    - ${adaptation.anchors.sample_power}
    - --anchor_sample_min_weight
    - ${adaptation.anchors.sample_min_weight}
    - --hull_m
    - ${adaptation.hull.M}
    - --hull_lambda
    - ${adaptation.hull.lambda}
    - --hull_steps
    - ${adaptation.hull.steps}
    - --hull_lr
    - ${adaptation.hull.lr}
    - --hull_weight_mode
    - ${adaptation.hull.weight_mode}
    - --hull_dirichlet_alpha
    - ${adaptation.hull.dirichlet_alpha}
    - --hull_label_mode
    - ${adaptation.hull.label_mode}
    - --hull_mix_label_mode
    - ${adaptation.hull.mix_label_mode}
    - --hull_label_lambda_y
    - ${adaptation.hull.label_lambda_y}
    - --hull_label_positive
    - ${adaptation.hull.label_positive}
    - --hull_label_negative_floor
    - ${adaptation.hull.label_negative_floor}
    - --hull_label_new_class_cap
    - ${adaptation.hull.label_new_class_cap}
    - --hull_include_anchor
    - --pgd_eps
    - ${adaptation.attack.pgd_eps}
    - --pgd_batch
    - ${adaptation.attack.pgd_batch}
    - --attack_success_margin
    - ${adaptation.attack.attack_success_margin}
    - --epochs
    - ${training.epochs}
    - --eval_every
    - ${training.eval_every}
    - --lr
    - ${training.optimizer.lr}
    - --weight_decay
    - ${training.optimizer.weight_decay}
    - --batch_size
    - ${training.batch_size}
    - --eval_batch_size
    - ${training.eval_batch_size}
    - --head_type
    - ${adaptation.ecgfounder.head_type}
    - --adapter_hidden
    - ${adaptation.ecgfounder.adapter_hidden}
    - --adapter_dropout
    - ${adaptation.ecgfounder.adapter_dropout}
    - --adapter_scale
    - ${adaptation.ecgfounder.adapter_scale}
    - --freeze_base_head
    - --init_base_head_from_k500_root
    - ${paths.output_root}/ecgfounder_direct_k500_v7_sjr_rgq/${runtime.run_id}/${matrix.center}/runs
    - --source_weight
    - ${adaptation.loss.source_weight}
    - --target_real_weight
    - ${adaptation.loss.target_real_weight}
    - --adv_weight
    - ${adaptation.loss.adv_weight}
    - --source_logit_anchor_weight
    - ${adaptation.loss.source_logit_anchor_weight}
    - --target_logit_anchor_weight
    - ${adaptation.loss.target_logit_anchor_weight}
    - --selection_metric
    - ${adaptation.selection.metric}
    - --selection_source
    - ${adaptation.selection.source}
    - --target_real_val_fraction
    - ${adaptation.selection.target_real_val_fraction}
    - --target_real_val_seed
    - ${paper_protocol.kshot.seed}
    - --source_selection_weight
    - ${adaptation.selection.source_selection_weight}
    - --source_auprc_floor
    - ${adaptation.selection.source_auprc_floor}
    - --source_floor_penalty
    - ${adaptation.selection.source_floor_penalty}
    - --anchor_base_root
    - ${adaptation.anchors.base_root}
    - --ref_root
    - ${data.kshot_subset_root}
    - --seed
    - ${paper_protocol.kshot.seed}
    - --device
    - cuda
    - --report_drop_all_zero_pn2021

lineage:
  replaces_legacy_surface: scripts/paper/run_ecgfounder_v7_multiseed_kshot_matrix_20260530.py
  scope: ecgfounder_vae_lhat_k500_only
  prerequisite_stage: ecgfounder_direct_k500_v7_sjr_rgq_matrix
  notes:
    - This managed config replaces the ECGFounder VAE-LHAT K500 command expansion from the dated matrix runner.
    - Percent-shot ECGFounder VAE-LHAT remains a separate managed surface because each protocol has a different exported K.
