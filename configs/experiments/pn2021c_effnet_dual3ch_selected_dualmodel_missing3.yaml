extends:
  - pn2021c_official_s5_locked_protocol.yaml

experiment:
  name: pn2021c_effnet_dual3ch_selected_dualmodel_missing3
  description: Dual-model PN2021-C evaluation for selected EfficientNet direct/noAug/locked/cand09/cand10 methods on the three non-CPSC centers.

paper_protocol:
  kshot:
    seed: 20260601
    subset_seed: 20260601

evaluation:
  severity_profile: custom
  severity_params_file: configs/corruption_profiles/pn2021c_dual_model_10to15pp_v1.yaml
  severity_params_name: dual_model_10to15pp_v1
  severities: [5]
  corruption_input: raw_first
  output_stem: eval_pn2021_c_v7_refexcluded_stream_dual_model_10to15pp_v1_raw_first

logging:
  child_artifacts:
    - eval_pn2021_c_v7_refexcluded_stream_dual_model_10to15pp_v1_raw_first.json
  postprocess_artifacts:
    - pn2021c_effnet_dual3ch_selected_dualmodel_missing3.csv

runner:
  matrix:
    center:
      - ningbo
      - chapman_shaoxing
      - georgia
    method:
      - name: direct_k500
        family: effnet_direct_k500_v7_sjr_rgq
        model_dir_template: >-
          {output_root}/effnet_direct_k500_v7_sjr_rgq/seed20260601_k500_v7_sjr_rgq_20260530_rep1/runs/{center}_K500_direct_ft_ep30_seed20260601_val0.2
        checkpoint_name: best_model.pt
        clean_eval_name: eval_result_v7_super5_sjr_rgq_review_exclrefs_crop1000.json
      - name: vae_noaug
        family: effnet_vae_noaug_k500_v7_sjr_rgq
        model_dir_template: >-
          {output_root}/effnet_vae_noaug_k500_v7_sjr_rgq/seed20260601_k500_v7_sjr_rgq_20260530_rep1/{center}_realall_targetheavy_M20_lam0p05_augmix_s2_wlat0p25_hs3_target_macro_auprc_cdhypminormsttc_hlabelcom_anchor_soft_sta_local_random_p120_fullft_k500_noaugmix_ep30_seed20260601
        checkpoint_name: best_model.pt
        clean_eval_name: eval_result_v7_exclrefs_crop1000.json
      - name: threechain_official_s5_locked
        family: effnet_vae_lhat_augmix_threechain_locked_k500
        model_dir_template: >-
          {output_root}/effnet_vae_lhat_augmix_threechain_locked_k500/locked_rawfirst_20260618_effnet_copies2/{center}_realall_targetheavy_M20_lam0p05_augmix_s5_wlat0p25_hs3_target_macro_auprc_cdhypminormsttc_hlabelcom_anchor_soft_sta_local_random_p120_fullft_k500_threechain_s5_locked_ep30_seed20260601
        checkpoint_name: last_model.pt
        clean_eval_name: eval_result_v7_exclrefs_crop1000.json
      - name: cand09_highfreq_c6_cw10_bce3_m095
        family: effnet_vae_lhat_augmix_threechain_dualmodel_cand09_highfreq_missing3
        model_dir_template: >-
          {output_root}/effnet_vae_lhat_augmix_threechain_dualmodel_cand09_highfreq_missing3/dual3ch_cand09_highfreq_missing3_20260620/{center}_realall_targetheavy_M20_lam0p12_augmix_s5_wlat0p65_hs6_target_macro_auprc_cdhypminormsttc_hlabelcom_anchor_soft_sta_local_random_p120_fullft_k500_dual3ch_highfreq_hlam12_hs6_lr40_c6_cw10_bce3_m095_aw2p0_ka1600_wlat65_b64_ep30_seed20260601
        checkpoint_name: last_model.pt
        clean_eval_name: eval_result_v7_exclrefs_crop1000.json
      - name: cand10_advheavy_hlam20_aw3p0
        family: effnet_vae_lhat_augmix_threechain_dualmodel_cand10_advheavy
        model_dir_template: >-
          {output_root}/effnet_vae_lhat_augmix_threechain_dualmodel_cand10_advheavy_{center}/dual3ch_cand10_advheavy_{center}_20260620/{center}_realall_targetheavy_M20_lam0p2_augmix_s5_wlat0p5_hs8_target_macro_auprc_cdhypminormsttc_hlabelcom_anchor_soft_sta_local_random_p120_fullft_k500_dual3ch_advheavy_hlam20_hs8_lr50_c4_cw10_bce3_m090_aw3p0_ka1800_treal40_ep30_seed20260601
        checkpoint_name: last_model.pt
        clean_eval_name: eval_result_v7_exclrefs_crop1000.json
  name: ${experiment.name}_${matrix.center}_${matrix.method.name}

run_record:
  purpose: Evaluate selected CPSC-guided tuned mainline candidates on dual_model_10to15pp_v1 for non-CPSC centers.
  result_summary: Pending.
  registration_status: provisional
