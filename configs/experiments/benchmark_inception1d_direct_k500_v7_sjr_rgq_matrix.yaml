extends:
  - ../defaults/benchmark_backbone_v7_sjr_rgq_defaults.yaml

experiment:
  name: benchmark_inception1d_direct_k500_v7_sjr_rgq_matrix
  description: Per-center benchmark Inception1D direct K500 v7 SJR/RGQ matrix launch surface with explicit source-checkpoint prerequisite.

model:
  backbone: benchmark_inception1d
  name: benchmark_inception1d
  num_classes: 5

runner:
  entrypoint: scripts/paper/run_benchmark_direct_finetune_v7_20260530.py
  name: ${experiment.name}_${matrix.center}
  matrix:
    center: ${paper_protocol.centers.target_4}
  argv:
    - --centers
    - ${matrix.center}
    - --k
    - ${paper_protocol.kshot.k}
    - --subset_seed
    - ${paper_protocol.kshot.subset_seed}
    - --seed
    - ${paper_protocol.kshot.seed}
    - --model_name
    - ${model.name}
    - --init_ckpt
    - ${model.source_checkpoint}
    - --epochs
    - ${training.epochs}
    - --lr
    - ${training.optimizer.lr}
    - --weight_decay
    - ${training.optimizer.weight_decay}
    - --grad_clip
    - ${training.grad_clip}
    - --batch_size
    - ${training.batch_size}
    - --eval_batch_size
    - ${training.eval_batch_size}
    - --crop_len
    - ${preprocess.crop_len}
    - --val_fraction
    - 0.2
    - --num_workers
    - ${training.num_workers}
    - --device
    - cuda
    - --pos_weight_clip_max
    - ${training.pos_weight_clip_max}
    - --eval_min_pos
    - ${evaluation.min_pos}
    - --eval_pn2021_limit
    - ${evaluation.pn2021_limit}
    - --data_root
    - ${paths.data_root}
    - --python
    - ${python.executable}
    - --subset_root
    - ${data.kshot_subset_root}
    - --out_root
    - ${paths.output_root}/${model.name}_direct_k500_v7_sjr_rgq/${runtime.run_id}/${matrix.center}

adaptation:
  method: benchmark_direct_target_k500_finetune

lineage:
  replaces_legacy_surface: scripts/paper/run_benchmark_backbone_v7_kshot_matrix_20260530.py
  scope: benchmark_inception1d_direct_k500_only
  prerequisite_config: configs/experiments/benchmark_source_v7_sjr_rgq_matrix.yaml
  notes:
    - This managed config replaces the Direct K500 command expansion for benchmark_inception1d only.
    - Source checkpoint training remains an explicit prerequisite instead of being hidden inside a matrix launcher.
