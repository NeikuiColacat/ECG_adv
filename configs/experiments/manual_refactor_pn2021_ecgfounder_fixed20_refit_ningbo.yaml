schema_version: 1

experiment:
  name: manual_refactor_pn2021_ecgfounder_fixed20_refit_ningbo
  purpose: Refit the family-balanced ECGFounder Direct baseline on full Ningbo K500 for the globally selected epoch.

entrypoint:
  name: refit_pn2021_direct
  config: train/PN2021_fixed20.yaml
  arguments:
    - --model
    - ecgfounder
    - --method-config
    - train/methods/direct_depth23_fixed20.yaml
    - --center
    - ningbo
    - --selection-json
    - /home/linbinhao/ECG_adv_data/runs/manual_refactor/managed_pn2021_ecgfounder_direct_selection_h20/training/direct_baseline_selection.json

output:
  run_dir: /home/linbinhao/ECG_adv_data/runs/manual_refactor/managed_pn2021_ecgfounder_fixed20_refit_ningbo
  if_exists: error
  delegate_output_subdir: training
