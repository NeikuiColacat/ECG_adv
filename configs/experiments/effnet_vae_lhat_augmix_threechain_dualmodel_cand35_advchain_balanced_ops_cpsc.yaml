extends:
  - effnet_vae_lhat_augmix_threechain_dualmodel_cand31_q2048_bufferdominant_cpsc.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_dualmodel_cand35_advchain_balanced_ops_cpsc
  description: "CPSC probe: preserve cand31 q2048 buffer-dominant pressure, raise the VAE-LH adversarial waveform chain share, and rebalance raw AugMix exposure toward powerline, baseline shift/wander, and lead masking."

adaptation:
  run_tag_extra: trraw_proxy_q2048r1_adv20_balops_aw24_tw45_hs10_lam20_c8_cw20_b8
  latent_augmix:
    copies: 8
    chain_weights: "0.40,0.40,0.20"
    ops:
      - powerline_noise
      - baseline_wander
      - baseline_shift
      - random_leads_masking
      - powerline_noise
      - baseline_wander
      - baseline_shift
      - random_leads_masking
    consistency:
      enabled: true
      consistency_weight: 20.0
      consistency_loss: jsd
      bce_weight: 8.0
      max_batches: 0

run_record:
  purpose: Test whether cand31 is limited by underusing the VAE-LH adversarial waveform chain and by weak balanced exposure to the two weakest raw operator families, while preserving the locked three-chain AugMix mainline.
  result_summary: Pending.
  registration_status: provisional
