extends:
  - effnet_vae_lhat_augmix_threechain_dualmodel_k500_cpsc_base.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_dualmodel_cpsc_strong_hlam15_aw2p0_c4_cw8_bce2_m090
  description: "CPSC dual_model high-pressure candidate: hull lambda 0.15, steps6/lr0.40, copies4, JSD8/BCE2, fixed mix 0.90, reduced clean target dominance."

training:
  batch_size: 96

adaptation:
  run_tag_extra: k500_dual3ch_strong_hlam15_hs6_lr40_c4_cw8_bce2_m090_aw2p0_ka1400_wlat50_treal60
  anchors:
    k_anchor: 1400
  hull:
    lambda: 0.15
    steps: 6
    lr: 0.40
  loss:
    target_real_weight: 60.0
    adv_weight: 2.0
    adv_weight_warmup_epochs: 2
  latent_augmix:
    copies: 4
    latent_weight_cap: 0.50
    depth: 1
    mixture:
      mode: fixed
      prob: 0.90
    consistency:
      enabled: true
      consistency_weight: 8.0
      consistency_loss: jsd
      bce_weight: 2.0
      max_batches: 0

run_record:
  purpose: Stress-test whether much stronger VAE-LH hard-sample and three-chain AugMix pressure can approach 10 pp PN2021-C recovery while remaining a learned model-parameter method.
  result_summary: Pending.
  registration_status: provisional
