extends:
  - pn2021c_official_s5_locked_protocol.yaml

experiment:
  name: pn2021c_effnet_dual3ch_cand15_freq_cpsc
  description: CPSC dual-model PN2021-C evaluation for cand15 frequency probe.

paper_protocol:
  kshot:
    seed: 20260601
    subset_seed: 20260601

evaluation:
  severity_profile: custom
  severity_params_file: configs/corruption_profiles/pn2021c_dual_model_10to15pp_v1.yaml
  severity_params_name: dual_model_10to15pp_v1
  severities: [5]
  corruption_input: raw_first
  output_stem: eval_pn2021_c_v7_refexcluded_stream_dual_model_10to15pp_v1_raw_first

logging:
  child_artifacts:
    - eval_pn2021_c_v7_refexcluded_stream_dual_model_10to15pp_v1_raw_first.json
  postprocess_artifacts:
    - pn2021c_effnet_dual3ch_cand15_freq_cpsc.csv

runner:
  matrix:
    center:
      - cpsc_2018
    method:
      - name: cand15_freq_cpsc
        family: effnet_vae_lhat_augmix_threechain_dualmodel_cand15_freq_cpsc
        model_dir_template: >-
          {output_root}/effnet_vae_lhat_augmix_threechain_dualmodel_cand15_freq_cpsc/dual3ch_cand15_freq_cpsc_20260620/{center}_realall_targetheavy_M20_lam0p18_augmix_s5_wlat0p3_hs10_target_macro_auprc_cdhypminormsttc_hlabelcom_anchor_soft_sta_local_random_p120_fullft_trraw_freq_c10_b32_cw25_b24_aw8_tw25_hs10_lam18_ep40_seed20260601
        checkpoint_name: last_model.pt
        clean_eval_name: eval_result_v7_exclrefs_crop1000.json
  name: ${experiment.name}_${matrix.center}_${matrix.method.name}

run_record:
  purpose: Evaluate whether cand15 frequency probe beats the CPSC-only +4 pp ceiling before expanding to four centers.
  result_summary: Pending.
  registration_status: provisional
