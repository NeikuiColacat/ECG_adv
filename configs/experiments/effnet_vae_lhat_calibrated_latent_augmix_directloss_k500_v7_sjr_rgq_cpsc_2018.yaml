extends:
  - effnet_vae_lhat_calibrated_latent_augmix_k500_v7_sjr_rgq_cpsc_2018.yaml

experiment:
  name: effnet_vae_lhat_calibrated_latent_augmix_directloss_k500_v7_sjr_rgq_cpsc_2018
  description: Single-center CPSC 2018 calibrated-profile latent AugMix with direct BCE/JSD training on generated AugMix views.

adaptation:
  run_tag_extra: k500_callatentaugmix_directloss
  latent_augmix:
    copies: 2
    consistency:
      enabled: true
      consistency_weight: 2.0
      consistency_loss: jsd
      bce_weight: 1.0
      max_batches: 0

run_record:
  purpose: Test whether latent-AugMix views recover PN2021-C robustness when trained through a direct supervised/JSD loss instead of only entering the adversarial buffer.
  result_summary: Completed 2026-06-15 on CPSC 2018. CPSC PN2021-C calibrated AUPRC was 0.4821, +1.06 pp over noAug but still far below calibrated raw-supervised 0.5351; do not expand as-is.
  registration_status: provisional
