run_record:
  purpose: >-
    Test an operator-balanced c12 variant after cand78/cand86 remained below
    the +10 pp target and cand81 showed that raw-heavy powermask can hurt
    non-mask operators. This keeps the VAE-LH hard-sample search and locked
    three-chain AugMix topology, gives powerline and random-lead masking one
    extra view each, and restores the VAE adversarial waveform chain to 0.15.
  result_summary: Pending.
  registration_status: provisional
