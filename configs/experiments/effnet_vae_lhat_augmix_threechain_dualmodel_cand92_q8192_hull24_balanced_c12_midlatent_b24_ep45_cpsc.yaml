  description: "CPSC pilot: balanced c12 AugMix exposure with extra powerline/random-mask and restored moderate VAE-LH adversarial waveform-chain share."

training:
  epochs: 45
  batch_size: 24
  num_workers: 6

adaptation:
  run_tag_extra: trraw_proxy16_q8192r1_balanced_c12_midlat_aw24_tw45_hs12_lam24_c12_cw16_b6_b24_ep45
  latent_augmix:
    copies: 12
