extends:
  - ../defaults/ecgfounder_v7_sjr_rgq_defaults.yaml

experiment:
  name: ecgfounder_k500_fullft_locked
  description: Locked ECGFounder K500 full fine-tuning surface using PTB-XL full-FT last checkpoint initialization and no K500 validation split.

paper_protocol:
  selection:
    policy: last_checkpoint_only
    allowed_data: [target_k500_train_all, ptbxl_source_sanity]
    forbid_k500_validation_split: true
    forbid_best_checkpoint_selection: true
    forbid_heldout_target_labels: true
    forbid_full_target_distribution_tuning: true

model:
  init_model_path: ${paths.output_root}/ecgfounder_ptbxl_super5_fullft_locked/${runtime.run_id}/runs/ptbxl_super5_fullft_locked/last_model.pt

data:
  target_real_npz_suffix: .raw1000.npz

training:
  epochs: 10
  batch_size: 64
  eval_batch_size: 128
  num_workers: ${resources.default_num_workers}
  source_train_limit: 0
  optimizer:
    name: adamw
    lr: 0.00002
    weight_decay: 0.0001

adaptation:
  method: ecgfounder_k500_full_finetune_locked_last
  run_name: ${matrix.center}_k500_fullft_locked
  supervised_input_mode: raw1000
  loss:
    source_weight: 1.0
    target_real_weight: 40.0

runner:
  entrypoint: ecg_adv_gen/runner/ecgfounder_fullft.py
  adapter: ecgfounder_fullft
  matrix:
    center: ${paper_protocol.centers.target_4}

logging:
  child_artifacts:
    - last_model.pt
    - training_log.json
    - eval_result.json
