extends:
  - pn2021c_official_s5_locked_protocol.yaml

experiment:
  name: pn2021c_effnet_dual3ch_cand21to24_powerline_native_cpsc
  description: CPSC native-raw-first powerline evaluation for low-PTB EfficientNet VAE-LH AugMix candidates.

paper_protocol:
  kshot:
    seed: 20260601
    subset_seed: 20260601

evaluation:
  severity_profile: custom
  severity_params_file: configs/corruption_profiles/pn2021c_dual_model_10to15pp_v1.yaml
  severity_params_name: dual_model_10to15pp_v1
  corruptions:
    - powerline_noise
  severities: [5]
  corruption_input: native_raw_first
  output_stem: eval_powerline_native_raw_first

logging:
  child_artifacts:
    - eval_powerline_native_raw_first.json
  postprocess_artifacts:
    - pn2021c_effnet_dual3ch_cand21to24_powerline_native_cpsc.csv

runner:
  matrix:
    center:
      - cpsc_2018
    method:
      - name: cand21_lowptb_balanced_cpsc
        family: effnet_vae_lhat_augmix_threechain_dualmodel_cand21_lowptb_balanced_cpsc
        model_dir_template: >-
          {output_root}/effnet_vae_lhat_augmix_threechain_dualmodel_cand21_lowptb_balanced_cpsc/dual3ch_cand21_lowptb_balanced_cpsc_20260620/{center}_realall_targetheavy_M20_lam0p2_augmix_s5_wlat0p3_hs10_target_macro_auprc_cdhypminormsttc_hlabelcom_anchor_soft_sta_local_random_p120_fullft_trraw_proxy_lowptb02_bal_aw12_tw60_hs10_lam20_c6_cw14_b5_ep30_seed20260601
        checkpoint_name: last_model.pt
        clean_eval_name: eval_result_v7_exclrefs_crop1000.json
      - name: cand22_lowptb_hardvae_cpsc
        family: effnet_vae_lhat_augmix_threechain_dualmodel_cand22_lowptb_hardvae_cpsc
        model_dir_template: >-
          {output_root}/effnet_vae_lhat_augmix_threechain_dualmodel_cand22_lowptb_hardvae_cpsc/dual3ch_cand22_lowptb_hardvae_cpsc_20260620/{center}_realall_targetheavy_M20_lam0p25_augmix_s5_wlat0p3_hs12_target_macro_auprc_cdhypminormsttc_hlabelcom_anchor_soft_sta_local_random_p120_fullft_trraw_proxy_lowptb01_hardvae_aw12_tw70_hs12_lam25_c6_cw14_b5_ep30_seed20260601
        checkpoint_name: last_model.pt
        clean_eval_name: eval_result_v7_exclrefs_crop1000.json
      - name: cand23_lowptb_bufferheavy_cpsc
        family: effnet_vae_lhat_augmix_threechain_dualmodel_cand23_lowptb_bufferheavy_cpsc
        model_dir_template: >-
          {output_root}/effnet_vae_lhat_augmix_threechain_dualmodel_cand23_lowptb_bufferheavy_cpsc/dual3ch_cand23_lowptb_bufferheavy_cpsc_20260620/{center}_realall_targetheavy_M20_lam0p2_augmix_s5_wlat0p3_hs10_target_macro_auprc_cdhypminormsttc_hlabelcom_anchor_soft_sta_local_random_p120_fullft_trraw_proxy_lowptb005_buf_aw16_tw55_hs10_lam20_c6_cw16_b6_ep30_seed20260601
        checkpoint_name: last_model.pt
        clean_eval_name: eval_result_v7_exclrefs_crop1000.json
      - name: cand24_lowptb_shiftmask_cpsc
        family: effnet_vae_lhat_augmix_threechain_dualmodel_cand24_lowptb_shiftmask_cpsc
        model_dir_template: >-
          {output_root}/effnet_vae_lhat_augmix_threechain_dualmodel_cand24_lowptb_shiftmask_cpsc/dual3ch_cand24_lowptb_shiftmask_cpsc_20260620/{center}_realall_targetheavy_M20_lam0p18_augmix_s5_wlat0p2_hs10_target_macro_auprc_cdhypminormsttc_hlabelcom_anchor_soft_sta_local_random_p120_fullft_trraw_proxy_lowptb01_shiftmask_aw12_tw60_hs10_lam18_c8_cw20_b10_ep30_seed20260601
        checkpoint_name: last_model.pt
        clean_eval_name: eval_result_v7_exclrefs_crop1000.json
  name: ${experiment.name}_${matrix.center}_${matrix.method.name}

run_record:
  purpose: Evaluate native acquisition-side powerline stress for low-PTB EfficientNet VAE-LH plus locked three-chain AugMix candidates, matching the mixed-mode PN2021-C reporting protocol.
  result_summary: Pending.
  registration_status: provisional
