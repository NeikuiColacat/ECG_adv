extends:
  - ../defaults/common_v7_sjr_rgq_super5.yaml

experiment:
  name: pn2021c_effnet_v7_augmix_vs_noaug
  description: Managed PN2021-C Super5 v7 ref-excluded corruption evaluation for EfficientNet1DV2 VAE noAug and VAE LHAT runs.

model:
  backbone: efficientnet1dv2
  num_classes: 5
  eval_seed: 20260601
  epochs: 30
  run_stamp: 20260530_rep1
  clean_eval_name: eval_result_v7_exclrefs_crop1000.json
  run_leaf_stem: realall_targetheavy_M20_lam0p05_augmix_s2_wlat0p25_hs3_target_macro_auprc_cdhypminormsttc_hlabelcom_anchor_soft_sta_local_random_p120

training:
  eval_batch_size: 192
  num_workers: ${resources.default_num_workers}

data:
  cache:
    pn2021_clean_cache_dir: ${paths.data_root}/triple_labels/pn2021_eval_cache_minresample_perglobal
    pn2021_clean_mmap_cache_dir: ${paths.data_root}/triple_labels/pn2021_eval_cache_mmap_minresample_perglobal

evaluation:
  views:
    - pn2021_all_zero_kept_refexcluded
    - pn2021_drop_all_zero_refexcluded
    - pn2021c_corrupted_refexcluded
  model_family: effnet_v7_augmix_vs_noaug
  corruption_seed: 20260501
  severity_profile: standard
  corruptions:
    - powerline_noise
    - emg_noise
    - baseline_wander
    - baseline_shift
    - random_leads_masking
  severities: [1, 2, 3, 4, 5]

logging:
  child_artifacts:
    - eval_pn2021_c_v7_refexcluded_stream_standard.json
  postprocess_artifacts:
    - pn2021c_augmix_vs_noaug.csv

runner:
  entrypoint: scripts/triple_labels/eval_pn2021_corruptions.py
  env:
    ECG_ADV_GEN_DATA_ROOT: ${paths.data_root}
    TMPDIR: ${paths.short_tmp_root}
    XDG_CACHE_HOME: ${paths.cache_root}
  matrix:
    center: ${paper_protocol.centers.target_4}
    method:
      - name: vae_noaug
        family: effnet_vae_noaug_k500_v7_sjr_rgq
        noaug_suffix: _noaugmix
      - name: vae_lhat
        family: effnet_vae_lhat_k500_v7_sjr_rgq
        noaug_suffix: ""
  name: ${experiment.name}_${matrix.center}_${matrix.method.name}
  argv:
    - --mode
    - stream
    - --scheme
    - super5
    - --model_dir
    - ${paths.output_root}/${matrix.method.family}/seed${model.eval_seed}_k${paper_protocol.kshot.k}_v7_sjr_rgq_${model.run_stamp}/${matrix.center}_${model.run_leaf_stem}_fullft_k${paper_protocol.kshot.k}${matrix.method.noaug_suffix}_ep${model.epochs}_seed${model.eval_seed}
    - --clean_mmap_cache_dir
    - ${data.cache.pn2021_clean_mmap_cache_dir}
    - --clean_cache_dir
    - ${data.cache.pn2021_clean_cache_dir}
    - --clean_eval_json
    - ${paths.output_root}/${matrix.method.family}/seed${model.eval_seed}_k${paper_protocol.kshot.k}_v7_sjr_rgq_${model.run_stamp}/${matrix.center}_${model.run_leaf_stem}_fullft_k${paper_protocol.kshot.k}${matrix.method.noaug_suffix}_ep${model.epochs}_seed${model.eval_seed}/${model.clean_eval_name}
    - --centers
    - ${matrix.center}
    - --corruptions
    - ${evaluation.corruptions}
    - --severities
    - ${evaluation.severities}
    - --severity_profile
    - ${evaluation.severity_profile}
    - --device
    - cuda
    - --crop_len
    - ${preprocess.crop_len}
    - --batch_size
    - ${training.eval_batch_size}
    - --num_workers
    - ${training.num_workers}
    - --min_pos
    - ${evaluation.min_pos}
    - --seed
    - ${evaluation.corruption_seed}
    - --exclude_ref_ids
    - ${data.kshot_subset_root}/${matrix.center}/k${paper_protocol.kshot.k}_seed${paper_protocol.kshot.seed}/${matrix.center}_real_k${paper_protocol.kshot.k}_seed${paper_protocol.kshot.seed}.ref_meta.json
    - --output_path
    - ${paths.output_root}/${experiment.name}/${runtime.run_id}/${matrix.center}/${matrix.method.name}/eval_pn2021_c_v7_refexcluded_stream_standard.json
