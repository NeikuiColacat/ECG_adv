extends:
  - effnet_vae_lhat_augmix_threechain_dualmodel_cand23_lowptb_bufferheavy_cpsc.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_dualmodel_cand26_boundary_freshbuf_cpsc
  description: "CPSC probe: focus the online buffer on boundary-range hard views while keeping the locked three-chain VAE-LH AugMix main method."

adaptation:
  run_tag_extra: trraw_proxy_boundary_q1024r1_lw20_aw20_tw50_c6_b01585
  attack:
    boundary_prob_min: 0.15
    boundary_prob_max: 0.85
  loss:
    ptbxl_weight: 0.05
    target_real_weight: 50.0
    adv_weight: 20.0
    adv_weight_warmup_epochs: 1
  buffer:
    qab_size: 1024
    rescore_interval: 1
    asr_consec_low_max: 999
    asr_low_threshold: 0.20
  latent_augmix:
    chain_weights: "0.40,0.40,0.20"
    consistency:
      consistency_weight: 18.0
      bce_weight: 6.0

run_record:
  purpose: Test whether explicitly retaining near-boundary VAE-LH/AugMix samples prevents the late-ASR collapse seen in cand21-24 and improves low-frequency/mask recovery.
  result_summary: Pending.
  registration_status: provisional
