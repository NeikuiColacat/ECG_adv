extends:
  - ../defaults/common_v7_sjr_rgq_super5.yaml

experiment:
  name: benchmark_source_v7_sjr_rgq_matrix
  description: Source PTB-XL Super5 pretraining launch surface for benchmark 1D ECG backbones used by v7 SJR/RGQ benchmark adapters.

training:
  epochs: 30
  batch_size: 128
  num_workers: ${resources.default_num_workers}
  patience: 8
  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.01
  pos_weight_clip_max: 50.0

model:
  backbone: benchmark_1d_source_matrix
  name: benchmark_1d_source_matrix
  num_classes: 5

runner:
  entrypoint: scripts/triple_labels/train_ptbxl.py
  name: ${experiment.name}_${matrix.model}
  matrix:
    model:
      - benchmark_resnet1d_wang
      - benchmark_inception1d
      - benchmark_fcn_wang
  argv:
    - --scheme
    - super5
    - --model_name
    - ${matrix.model}
    - --output_dir
    - ${paths.output_root}/benchmark_source_v7_sjr_rgq/${matrix.model}_seed${paper_protocol.kshot.seed}_v7_sjr_rgq_${runtime.run_id}
    - --data_path
    - ${paths.data_root}/ptbxl/raw100.npy
    - --csv_path
    - ${paths.data_root}/ptbxl/ptbxl_database.csv
    - --cache_path
    - ${paths.data_root}/triple_labels/cache/ptbxl_minimal_resample_per_sample_global_fs100_len1000.npy
    - --preprocess_mode
    - ${preprocess.mode}
    - --norm_mode
    - ${preprocess.norm_mode}
    - --device
    - cuda
    - --crop_len
    - ${preprocess.crop_len}
    - --batch_size
    - ${training.batch_size}
    - --epochs
    - ${training.epochs}
    - --lr
    - ${training.optimizer.lr}
    - --weight_decay
    - ${training.optimizer.weight_decay}
    - --cosine_tmax
    - ${training.epochs}
    - --patience
    - ${training.patience}
    - --num_workers
    - ${training.num_workers}
    - --seed
    - ${paper_protocol.kshot.seed}
    - --checkpoint_metric
    - auprc
    - --pos_weight_clip_max
    - ${training.pos_weight_clip_max}

adaptation:
  method: benchmark_source_pretrain

logging:
  launch_artifacts:
    - run_config.resolved.yaml
    - run_config.resolved.json
    - run_manifest.json
    - command.sh
    - data_manifest.json
    - selection.json
    - run_card.json
    - run_file_index.json
    - summary.md

lineage:
  replaces_legacy_surface: scripts/paper/run_benchmark_backbone_v7_kshot_matrix_20260530.py
  scope: benchmark_source_pretrain_all_default_models
  notes:
    - This managed config replaces the source-pretrain command expansion hidden inside the dated benchmark matrix runner.
    - It trains PTB-XL Super5 source checkpoints only; target K-shot direct and VAE-LHAT adaptation remain separate managed launch surfaces.
