extends:
  - ecgfounder_vae_lhat_augmix_threechain_locked_k500.yaml

experiment:
  name: ecgfounder_vae_lhat_augmix_threechain_aligned_effnet_sota_k500
  description: ECGFounder ablation aligned to the current EfficientNet1DV2 SOTA VAE-LH plus locked three-chain AugMix training profile.

model:
  upstream_run_id: locked_rawfirst_20260618
  init_model_path: ${paths.output_root}/ecgfounder_k500_fullft_locked/locked_rawfirst_20260618/runs/${matrix.center}_k500_fullft_locked/last_model.pt

adaptation:
  run_name: ${matrix.center}_vae_lhat_augmix_threechain_aligned_effnet_sota
  latent_augmix:
    enabled: true
    topology: locked_three_chain
    copies: 10
    width: 3
    depth: 1
    alpha: 1.0
    severity: 5
    severity_profile: custom
    severity_params_file: configs/corruption_profiles/pn2021c_dual_model_10to15pp_train_proxy_v2.yaml
    severity_params_name: dual_model_10to15pp_train_proxy_v2
    mixture:
      mode: fixed
      prob: 1.0
      beta_a: 0.0
      beta_b: 0.0
    op_schedule: per_op
    chain_weights: 0.45,0.45,0.10
    ops:
      - powerline_noise
      - emg_noise
      - baseline_wander
      - baseline_shift
      - random_leads_masking
      - powerline_noise
      - baseline_wander
      - baseline_shift
      - random_leads_masking
      - random_leads_masking
    renorm: false
    clip_abs: 6.0

run_record:
  purpose: >-
    Test whether the current EfficientNet1DV2 SOTA training recipe transfers to
    ECGFounder when the AugMix corruption profile, copy count, fixed mixing,
    per-op schedule, and chain weights are matched. This remains a VAE-LH
    online adversarial plus locked three-chain AugMix method, with no
    stabilizer and no raw-supervised branch.
  result_summary: Pending.
  registration_status: provisional
