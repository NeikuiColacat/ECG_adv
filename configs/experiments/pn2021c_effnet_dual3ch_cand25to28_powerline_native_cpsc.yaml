        model_dir_template: >-
          {output_root}/effnet_vae_lhat_augmix_threechain_dualmodel_cand28_hardrefresh_cpsc/dual3ch_cand28_hardrefresh_cpsc_20260620/{center}_realall_targetheavy_M20_lam0p28_augmix_s5_wlat0p3_hs14_target_macro_auprc_cdhypminormsttc_hlabelcom_anchor_soft_sta_local_random_p120_fullft_trraw_proxy_hardrefresh_q512r1_lw25_aw20_tw45_hs14_lam28_c6_cw16_b6_ep30_seed20260601
