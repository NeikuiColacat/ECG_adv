extends:
  - pn2021c_official_s5_locked_protocol.yaml

experiment:
  name: pn2021c_effnet_dual3ch_cand33_cand34_powerline_native_cpsc
  description: CPSC native acquisition-side powerline PN2021-C evaluation for cand33/cand34 q2048 EfficientNet VAE-LH AugMix candidates.

paper_protocol:
  kshot:
    seed: 20260601
    subset_seed: 20260601

evaluation:
  severity_profile: custom
  severity_params_file: configs/corruption_profiles/pn2021c_dual_model_10to15pp_v1.yaml
  severity_params_name: dual_model_10to15pp_v1
  corruptions:
    - powerline_noise
  severities: [5]
  corruption_input: native_raw_first
  output_stem: eval_powerline_native_raw_first

logging:
  child_artifacts:
    - eval_powerline_native_raw_first.json
  postprocess_artifacts:
    - pn2021c_effnet_dual3ch_cand33_cand34_powerline_native_cpsc.csv

