extends:
  - pn2021c_ecgfounder_threechain_locked_official_s5.yaml

experiment:
  name: pn2021c_ecgfounder_aligned_effnet_sota_official_s5_locked_dualmodel_nonpower_ningbo
  description: Non-powerline bottleneck5000 PN2021-C dual_model_10to15pp_v1 eval for ECGFounder aligned-to-EffNet SOTA Ningbo.

evaluation:
  severity_profile: custom
  severity_params_file: configs/corruption_profiles/pn2021c_dual_model_10to15pp_v1.yaml
  severity_params_name: dual_model_10to15pp_v1
  severities: [5]
  corruption_input: bottleneck5000
  corruptions:
    - baseline_shift
    - baseline_wander
    - emg_noise
    - random_leads_masking
  output_stem: eval_pn2021_c_ecgfounder_v7_refexcluded_stream_dual_model_10to15pp_v1_bottleneck5000_nonpower

logging:
  child_artifacts:
    - eval_pn2021_c_ecgfounder_v7_refexcluded_stream_dual_model_10to15pp_v1_bottleneck5000_nonpower.json
  postprocess_artifacts:
    - pn2021c_ecgfounder_aligned_effnet_sota_dualmodel_nonpower_ningbo.csv

runner:
  matrix:
    center:
      - ningbo
    method:
      - name: ecgfounder_aligned_effnet_sota
        family: ecgfounder_vae_lhat_augmix_threechain_aligned_effnet_sota_ningbo_20260621
        run_dir_template: >-
          {output_root}/ecgfounder_vae_lhat_augmix_threechain_aligned_effnet_sota_ningbo_20260621/ecgfounder_aligned_ningbo_gpu7_20260621/runs/ningbo_vae_lhat_augmix_threechain_aligned_effnet_sota
  name: ${experiment.name}_${matrix.center}_${matrix.method.name}

run_record:
  purpose: Evaluate aligned ECGFounder on non-powerline dual_model corruptions with the locked bottleneck5000 path.
  result_summary: Pending.
  registration_status: provisional
