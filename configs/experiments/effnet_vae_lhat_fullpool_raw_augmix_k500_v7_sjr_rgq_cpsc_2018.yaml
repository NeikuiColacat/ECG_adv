adaptation:
  run_tag_extra: k500_fullpool_rawaugmix
  raw_corrupt_consistency:
    view_mode: augmix
    augmix:
      width: 3
      depth: -1
      alpha: 1.0

postprocess:
  commands: []

runner:
  matrix:
    center:
      - cpsc_2018

run_record:
