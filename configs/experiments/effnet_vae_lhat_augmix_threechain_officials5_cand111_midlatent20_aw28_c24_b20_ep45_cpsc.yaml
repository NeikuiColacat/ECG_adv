experiment:
  name: effnet_vae_lhat_augmix_threechain_officials5_cand111_midlatent20_aw28_c24_b20_ep45_cpsc
  description: "CPSC pilot: c107 with moderately higher VAE-LH adversarial-chain and buffer sampling pressure."

adaptation:
  run_tag_extra: c111officials5_midlatent20_aw28_c24_b20_ep45
  loss:
    adv_weight: 28.0
    adv_weight_warmup_epochs: 3
  latent_augmix:
    chain_weights: "0.40,0.40,0.20"

run_record:
  purpose: >-
    Test the user's hypothesis that the VAE-LH linear-combination hard samples
    may need more training weight. This keeps anchor-local compatible
    latent-hull search, the locked three-chain AugMix topology, official
    severity-5 standard corruptions, and c107 strong JSD/BCE losses, but
    raises the VAE-LH adversarial chain weight from 0.10 to 0.20 and the
    adversarial buffer sampling weight from 24 to 28 with a short warmup. It is
    not a stabilizer, oracle, single-chain AugMix, or raw-supervised branch.
  result_summary: Pending.
  registration_status: provisional
