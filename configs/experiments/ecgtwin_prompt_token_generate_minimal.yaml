extends:
  - ../defaults/common_v7_sjr_rgq_super5.yaml

experiment:
  name: ecgtwin_prompt_token_generate_minimal
  description: Managed minimal ECGTwin prompt-token synthetic generation launch surface for one target center.
  status: active-wrapped

training:
  num_workers: ${resources.default_num_workers}

model:
  backbone: ecgtwin_prompt_token
  name: ecgtwin_prompt_token_generate_minimal
  num_classes: 5
  victim_ckpt: ${paths.data_root}/triple_labels/super5/best_model.pt

adaptation:
  method: ecgtwin_prompt_token_generate
  prompt_token:
    cache_root: ${paths.data_root}/ecgtwin_prompt_token_super5/cache_v1
    prompt_bank: ${adaptation.prompt_token.cache_root}/text_prompt_bank.pt
    output_root: ${paths.output_root}/ecgtwin_prompt_token_minimal/${runtime.run_id}
    token_bank: ${adaptation.prompt_token.output_root}/prompt_token_train/prompt_token_bank.pt
    center: ningbo
    classes: [NORM, MI, STTC]
    arm: target_token
    n_per_class: 10
    steps: 25
    selection_seed: 42
    token_repeat: 1
    token_scale: 1.0

logging:
  child_artifacts:
    - samples.npz
    - summary.json
  postprocess_artifacts: []

runner:
  entrypoint: scripts/ecgtwin_gen/generate_center_prompt_token_synth.py
  name: ${experiment.name}
  argv:
    - --center
    - ${adaptation.prompt_token.center}
    - --classes
    - ${adaptation.prompt_token.classes}
    - --cache_root
    - ${adaptation.prompt_token.cache_root}
    - --token_bank
    - ${adaptation.prompt_token.token_bank}
    - --arm
    - ${adaptation.prompt_token.arm}
    - --prompt_bank
    - ${adaptation.prompt_token.prompt_bank}
    - --out_dir
    - ${adaptation.prompt_token.output_root}/generated/${adaptation.prompt_token.arm}
    - --K
    - ${paper_protocol.kshot.k}
    - --selection_seed
    - ${adaptation.prompt_token.selection_seed}
    - --n_per_class
    - ${adaptation.prompt_token.n_per_class}
    - --steps
    - ${adaptation.prompt_token.steps}
    - --device
    - cuda
    - --seed
    - ${paper_protocol.kshot.seed}
    - --victim_ckpt
    - ${model.victim_ckpt}
    - --victim_crop_len
    - 250
    - --token_repeat
    - ${adaptation.prompt_token.token_repeat}
    - --token_scale
    - ${adaptation.prompt_token.token_scale}

lineage:
  replaces_legacy_surface: scripts/ecgtwin_gen/run_center_token_effectiveness_pilot_20260503.sh
  scope: prompt_token_target_token_generation_minimal
  prerequisite_stage: ecgtwin_prompt_token_train_minimal
  notes:
    - This config intentionally covers one target-token arm for one center as a minimal managed surface before the full effectiveness-pilot matrix is lifted.
    - The token bank must come from prompt_token_train for the same runtime.run_id.
