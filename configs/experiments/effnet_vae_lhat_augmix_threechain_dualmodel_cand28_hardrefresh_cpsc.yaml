extends:
  - effnet_vae_lhat_augmix_threechain_dualmodel_cand23_lowptb_bufferheavy_cpsc.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_dualmodel_cand28_hardrefresh_cpsc
  description: "CPSC probe: stronger VAE-LH search with a small fresh buffer, testing whether cand23's late low-ASR state is caused by insufficient hard-sample refresh strength."

adaptation:
  run_tag_extra: trraw_proxy_hardrefresh_q512r1_lw25_aw20_tw45_hs14_lam28_c6_cw16_b6
  anchors:
    k_anchor: 2600
  hull:
    lambda: 0.28
    steps: 14
    lr: 0.70
  loss:
    ptbxl_weight: 0.05
    target_real_weight: 45.0
    adv_weight: 20.0
    adv_weight_warmup_epochs: 1
  buffer:
    qab_size: 512
    rescore_interval: 1
    asr_consec_low_max: 999
    asr_low_threshold: 0.20
  latent_augmix:
    chain_weights: "0.375,0.375,0.25"

run_record:
  purpose: Stress-test whether higher VAE-LH hard-search pressure plus rapid buffer turnover can move recovery toward +10 pp without adding any preprocessing stabilizer or standalone raw-supervised branch.
  result_summary: Pending.
  registration_status: provisional
