extends:
  - ../defaults/common_v6_super5.yaml

experiment:
  name: pn2021_eval_v6_refexcluded_smoke
  description: Small PN2021 Super5 v6 ref-excluded runtime smoke for the managed eval wrapper.
  status: smoke-only

model:
  backbone: efficientnet1dv2
  num_classes: 5

training:
  eval_batch_size: 64
  num_workers: 0

logging:
  child_artifacts:
    - eval_result_v7_super5_sjr_rgq_refexcluded_smoke.json
  postprocess_artifacts: []

evaluation:
  model_family: effnet_direct_k500_v6
  min_pos: 2
  pn2021_limit: 64
  ref_exclusion_meta:
    - ${paths.data_root}/paper_vae_only_latenthull_sweep_20260516/subsets/ningbo/k${paper_protocol.kshot.k}_seed${paper_protocol.kshot.seed}/ningbo_real_k${paper_protocol.kshot.k}_seed${paper_protocol.kshot.seed}.ref_meta.json
    - ${paths.data_root}/paper_vae_only_latenthull_sweep_20260516/subsets/chapman_shaoxing/k${paper_protocol.kshot.k}_seed${paper_protocol.kshot.seed}/chapman_shaoxing_real_k${paper_protocol.kshot.k}_seed${paper_protocol.kshot.seed}.ref_meta.json
    - ${paths.data_root}/paper_vae_only_latenthull_sweep_20260516/subsets/cpsc_2018/k${paper_protocol.kshot.k}_seed${paper_protocol.kshot.seed}/cpsc_2018_real_k${paper_protocol.kshot.k}_seed${paper_protocol.kshot.seed}.ref_meta.json
    - ${paths.data_root}/paper_vae_only_latenthull_sweep_20260516/subsets/georgia/k${paper_protocol.kshot.k}_seed${paper_protocol.kshot.seed}/georgia_real_k${paper_protocol.kshot.k}_seed${paper_protocol.kshot.seed}.ref_meta.json

runner:
  entrypoint: scripts/triple_labels/eval_crosscenter.py
  env:
    ECG_ADV_GEN_DATA_ROOT: ${paths.data_root}
    TMPDIR: ${paths.short_tmp_root}
    XDG_CACHE_HOME: ${paths.cache_root}
  matrix:
    center: ${paper_protocol.centers.target_4}
  argv:
    - --scheme
    - super5
    - --model_dir
    - ${paths.data_root}/paper_direct_finetune_k500_20260516/runs/${matrix.center}_K${paper_protocol.kshot.k}_direct_ft_ep30_seed${paper_protocol.kshot.seed}_val0.2
    - --model_name
    - ${model.backbone}
    - --device
    - cuda
    - --crop_len
    - ${preprocess.crop_len}
    - --batch_size
    - ${training.eval_batch_size}
    - --num_workers
    - ${training.num_workers}
    - --min_pos
    - ${evaluation.min_pos}
    - --ptbxl_csv
    - ${paths.data_root}/ptbxl/ptbxl_database.csv
    - --ptbxl_cache
    - ${paths.data_root}/triple_labels/cache/ptbxl_minimal_resample_per_sample_global_fs100_len1000.npy
    - --preprocess_mode
    - ${preprocess.mode}
    - --norm_mode
    - ${preprocess.norm_mode}
    - --pn2021_root
    - ${paths.data_root}/physionet2021
    - --pn2021_cache_dir
    - ${data.cache.pn2021_cache_dir}
    - --pn2021_mmap_cache_dir
    - ${data.cache.pn2021_mmap_cache_dir}
    - --pn2021_limit
    - ${evaluation.pn2021_limit}
    - --skip_mimic
    - --report_drop_all_zero_pn2021
    - --exclude_ref_ids
    - ${evaluation.ref_exclusion_meta}
    - --output_path
    - ${paths.output_root}/${experiment.name}/${runtime.run_id}/${matrix.center}/eval_result_v7_super5_sjr_rgq_refexcluded_smoke.json
