schema_version: 1

experiment:
  name: manual_refactor_pn2021_effnet_a3c_ningbo_v1
  purpose: Run the matched online depth-2/3 corruption baseline on Ningbo K500.

entrypoint:
  name: train_pn2021
  config: train/PN2021.yaml
  arguments:
    - --model
    - efficientnet1dv2
    - --method-config
    - train/methods/a3c_depth23_v1.yaml
    - --center
    - ningbo
    - --source-checkpoint
    - /home/linbinhao/ECG_adv_data/runs/manual_refactor/managed_ptbxl_effnet_source_v1/training/checkpoints/best.pt

output:
  run_dir: /home/linbinhao/ECG_adv_data/runs/manual_refactor/managed_pn2021_effnet_a3c_ningbo_v1
  if_exists: error
  delegate_output_subdir: training
