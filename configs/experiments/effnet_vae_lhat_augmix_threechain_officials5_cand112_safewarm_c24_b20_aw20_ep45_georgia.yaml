experiment:
  name: effnet_vae_lhat_augmix_threechain_officials5_cand112_safewarm_c24_b20_aw20_ep45_georgia
  description: "Georgia pilot: c107 strong official-s5 triplecover with gentler VAE-LH pressure and longer warmup."

adaptation:
  run_tag_extra: c112officials5_safewarm_c24_b20_aw20_ep45
  loss:
    adv_weight: 20.0
    adv_weight_warmup_epochs: 8
  latent_augmix:
    chain_weights: "0.425,0.425,0.15"

run_record:
  purpose: >-
    Test whether c111's stronger VAE-LH pressure is too aggressive early in
    training while c107 underweights the adversarial chain. This keeps c107's
    official standard severity-5 depth-3 triple-cover raw AugMix chains,
    locked three-chain topology, strong JSD/BCE consistency, and same-label
    local VAE-LH hard-sample search, but uses a smaller adversarial-buffer
    sampling weight with a longer warmup and a moderate adversarial AugMix
    chain weight. It is not a stabilizer, oracle, single-chain AugMix, or
    raw-supervised branch.
