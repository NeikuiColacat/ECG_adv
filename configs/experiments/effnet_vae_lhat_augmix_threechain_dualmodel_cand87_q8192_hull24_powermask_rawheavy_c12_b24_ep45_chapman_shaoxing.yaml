  description: "Chapman-Shaoxing probe: extend the CPSC powermask raw-chain-heavy recipe to a non-CPSC center with 45 epochs."

training:
  epochs: 45
  batch_size: 24
  num_workers: 6

adaptation:
  run_tag_extra: trraw_p16_q8192_pmraw_c12_aw24_t45_hs12_l24_b24_e45
