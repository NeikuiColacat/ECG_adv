    copies: 12
    chain_weights: "0.475,0.475,0.05"
    ops:
      - powerline_noise
      - random_leads_masking
      - powerline_noise
      - baseline_wander
      - random_leads_masking
      - baseline_shift
      - powerline_noise
      - random_leads_masking
      - emg_noise
      - baseline_wander
      - baseline_shift
