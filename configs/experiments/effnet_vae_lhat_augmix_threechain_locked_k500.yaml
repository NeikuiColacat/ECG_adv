extends:
  - ../defaults/effnet1dv2_v7_sjr_rgq_defaults.yaml
  - ../defaults/vae_lhat_defaults.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_locked_k500
  description: EfficientNet1DV2 K500 VAE-LHAT plus locked three-chain AugMix with official PN2021-C severity 5 and last-checkpoint evaluation.

paper_protocol:
  kshot:
    seed: 20260601
    subset_seed: 20260601
  selection:
    policy: last_checkpoint_only
    allowed_data:
      - target_k500_train_all
      - ptbxl_source_sanity
    forbid_k500_validation_split: true
    forbid_best_checkpoint_selection: true
    forbid_heldout_target_labels: true
    forbid_full_target_distribution_tuning: true

model:
  direct_init_root: ${paths.output_root}/effnet_direct_k500_v7_sjr_rgq/seed20260601_k500_v7_sjr_rgq_20260530_rep1/runs

training:
  epochs: 30

logging:
  child_artifacts:
    - last_model.pt
    - training_log.json
    - train_result.json
    - diagnostics_epoch.jsonl
    - checkpoints/checkpoint_latest.pt
    - eval_result_v7_exclrefs_crop1000.json
  required_epoch_metrics:
    - epoch
    - train_loss
    - val_loss
    - asr_overall
    - sample_any_positive_below_0p5_asr
    - attack_vs_anchor
    - loss_gain
    - decoded_invalid_rate
    - adv_weight_effective
    - latent_augmix_stats
    - hull_weight_entropy_mean

postprocess:
  commands:
    - name: export_metrics_long
      entrypoint: scripts/export_metrics_long.py
      env:
        TMPDIR: ${paths.short_tmp_root}
        XDG_CACHE_HOME: ${paths.cache_root}
      argv:
        - --input
        - ${paths.output_root}/${experiment.name}/${runtime.run_id}
        - --output-dir
        - ${paths.output_root}/metrics_export/${runtime.run_id}_${experiment.name}
        - --run-id
        - ${experiment.name}
        - --filter-to-target-center
        - --target-centers
        - ${paper_protocol.centers.target_4}
        - --expected-mapping-version
        - ${paper_protocol.mapping_version}
        - --expected-mapping-hash
        - ${paper_protocol.mapping_hash}
      expected_artifacts:
        - role: metrics_long
          path: ${paths.output_root}/metrics_export/${runtime.run_id}_${experiment.name}/metrics_long.csv
        - role: artifact_manifest
          path: ${paths.output_root}/metrics_export/${runtime.run_id}_${experiment.name}/artifact_manifest.json

    - name: export_paper_table_all_zero_kept
      entrypoint: scripts/export_paper_table.py
      env:
        TMPDIR: ${paths.short_tmp_root}
        XDG_CACHE_HOME: ${paths.cache_root}
      argv:
        - --metrics-long
        - ${paths.output_root}/metrics_export/${runtime.run_id}_${experiment.name}/metrics_long.csv
        - --output-dir
        - ${paths.output_root}/paper_table/${runtime.run_id}_${experiment.name}_all_zero_kept
        - --view
        - pn2021_all_zero_kept_refexcluded
        - --dataset
        - pn2021
        - --centers
        - ${paper_protocol.centers.target_4}
        - --no-dataset-rows
      expected_artifacts:
        - role: paper_table
          path: ${paths.output_root}/paper_table/${runtime.run_id}_${experiment.name}_all_zero_kept/paper_table.csv
        - role: paper_table_manifest
          path: ${paths.output_root}/paper_table/${runtime.run_id}_${experiment.name}_all_zero_kept/paper_table_manifest.json

    - name: export_paper_table_drop_all_zero
      entrypoint: scripts/export_paper_table.py
      env:
        TMPDIR: ${paths.short_tmp_root}
        XDG_CACHE_HOME: ${paths.cache_root}
      argv:
        - --metrics-long
        - ${paths.output_root}/metrics_export/${runtime.run_id}_${experiment.name}/metrics_long.csv
        - --output-dir
        - ${paths.output_root}/paper_table/${runtime.run_id}_${experiment.name}_drop_all_zero
        - --view
        - pn2021_drop_all_zero_refexcluded
        - --dataset
        - pn2021
        - --centers
        - ${paper_protocol.centers.target_4}
        - --no-dataset-rows
      expected_artifacts:
        - role: paper_table
          path: ${paths.output_root}/paper_table/${runtime.run_id}_${experiment.name}_drop_all_zero/paper_table.csv
        - role: paper_table_manifest
          path: ${paths.output_root}/paper_table/${runtime.run_id}_${experiment.name}_drop_all_zero/paper_table_manifest.json

runner:
  entrypoint: ecg_adv_gen/runner/effnet_vae_lhat_augmix.py
  adapter: effnet_vae_lhat
  env:
    ECG_ADV_GEN_DATA_ROOT: ${paths.data_root}
    TMPDIR: ${paths.short_tmp_root}
    XDG_CACHE_HOME: ${paths.cache_root}
  matrix:
    center: ${paper_protocol.centers.target_4}

data:
  target_real_npz_suffix: .raw1000.npz
  target_real_norm_mode: per_sample_global

adaptation:
  run_tag_extra: k500_threechain_s5_locked
  latent_augmix:
    topology: locked_three_chain
    chain_roles:
      - name: chain1
        role: official_corruption_chain
      - name: chain2
        role: official_corruption_chain
      - name: chain3
        role: vae_lhat_adversarial_waveform
    copies: 2
    latent_weight_cap: 0.25
    width: 3
    depth: -1
    alpha: 1.0
    severity: 5
    severity_profile: standard
    ops:
      - powerline_noise
      - emg_noise
      - baseline_wander
      - baseline_shift
      - random_leads_masking
    consistency:
      enabled: true
      consistency_weight: 2.0
      consistency_loss: jsd
      bce_weight: 1.0
      max_batches: 0

run_record:
  purpose: "Locked EfficientNet1DV2 main-method run: all K500 samples train, no K500 validation split, last checkpoint only, two official corruption chains plus one VAE-LHAT adversarial waveform chain."
  result_summary: Pending. Evaluate PN2021 clean and PN2021-C official severity 5 after smoke passes.
  registration_status: provisional
