extends:
  - ../defaults/effnet1dv2_v7_sjr_rgq_defaults.yaml
  - ../defaults/vae_lhat_defaults.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_locked_k500
  description: Matched-source EfficientNet1DV2 A5 K500 VAE-LHAT plus locked three-chain AugMix; pair with the A0 arm exposed by the shared trainer contract.

paper_protocol:
  kshot:
    seed: 20260601
    subset_seed: 20260601

model:
  init_lineage:
    stage: ptbxl_source
    checkpoint_sha256: f7a4b05d85da8352013b67a0d56d8d47378ab2abc196d1f3a6ba8bbf15aa40ea
    evidence_path: configs/evidence/effnet1dv2_ptbxl_source_super5_20260503.json

training:
  epochs: 30

logging:
  child_artifacts:
    - best_model.pt
    - last_model.pt
    - run_config.json
    - training_log.json
    - train_result.json
    - diagnostics_epoch.jsonl
    - checkpoints/checkpoint_latest.pt
    - eval_result_v7_exclrefs_crop1000.json
  required_epoch_metrics:
    - epoch
    - train_loss
    - val_loss
    - asr_overall
    - sample_any_positive_below_0p5_asr
    - attack_vs_anchor
    - loss_gain
    - decoded_invalid_rate
    - adv_weight_effective
    - latent_augmix_stats
    - latent_augmix_consistency_stats
    - target_adv_fraction_effective
    - hull_weight_entropy_mean
    - target_val_macro_auprc
    - source_val_macro_auprc
    - source_floor_passed
    - realized_optimizer_steps

runner:
  entrypoint: ecg_adv_gen/runner/effnet_vae_lhat_augmix.py
  adapter: effnet_vae_lhat
  env:
    ECG_ADV_GEN_DATA_ROOT: ${paths.data_root}
    TMPDIR: ${paths.short_tmp_root}
    XDG_CACHE_HOME: ${paths.cache_root}
  matrix:
    center: ${paper_protocol.centers.target_4}

data:
  target_real_npz_suffix: .raw1000.npz
  target_real_norm_mode: per_sample_global

adaptation:
  comparison_arm: a5
  run_tag_extra: matched_source_k500_threechain_s5_locked
  loss:
    ptbxl_weight: 0.0
  latent_augmix:
    chain_roles:
      - name: chain1
        role: clean_anchor_corruption_chain
      - name: chain2
        role: clean_anchor_corruption_chain
      - name: chain3
        role: vae_lhat_adversarial_waveform
    chain_base_mode: clean_clean_third
    copies: 2
    width: 3
    depth: -1
    alpha: 1.0
    severity: 5
    severity_profile: standard
    ops:
      - powerline_noise
      - emg_noise
      - baseline_wander
      - baseline_shift
      - random_leads_masking
    consistency:
      enabled: true
      consistency_weight: 2.0
      consistency_loss: jsd
      bce_weight: 1.0
      max_batches: 0

run_record:
  purpose: "Matched-source A5 mechanical contract: K500 internal validation, PTB-XL source floor, and the same optimizer budget as A0."
  result_summary: EVIDENCE_PENDING until paired A0/A5 reruns complete.
  registration_status: provisional
