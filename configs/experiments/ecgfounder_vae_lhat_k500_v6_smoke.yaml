extends:
  - ecgfounder_vae_lhat_k500_v6.yaml

experiment:
  name: ecgfounder_vae_lhat_k500_v6_smoke
  description: Short execute-smoke for ECGFounder residual-adapter VAE-LHAT K500 wrapper.
  status: smoke-only

training:
  epochs: 1
  eval_every: 1
  batch_size: 64
  eval_batch_size: 512
  source_train_limit: 64
  optimizer:
    lr: 0.0005
    weight_decay: 0.0001

adaptation:
  anchors:
    k_anchor: 16
  hull:
    M: 4
    lambda: 0.05
    steps: 1
    lr: 0.25
    neighbor_pool_size: 16
    neighbor_pool_multiplier: 2
  attack:
    pgd_batch: 8
  loss:
    source_weight: 1.0
    target_real_weight: 20.0
    adv_weight: 5.0
  selection:
    source_auprc_floor: 0.0
