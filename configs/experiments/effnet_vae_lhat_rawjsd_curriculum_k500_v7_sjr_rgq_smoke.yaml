extends:
  - effnet_vae_lhat_rawjsd_curriculum_k500_v7_sjr_rgq.yaml

experiment:
  name: effnet_vae_lhat_rawjsd_curriculum_k500_v7_sjr_rgq_smoke
  description: Single-center smoke test for the raw-JSD corruption curriculum EfficientNet1DV2 VAE-LHAT candidate.

training:
  epochs: 1
  batch_size: 32
  eval_batch_size: 64
  num_workers: 0

adaptation:
  anchors:
    k_anchor: 32
  hull:
    M: 4
    steps: 1
    neighbor_pool_size: 32
  attack:
    pgd_batch: 8
  loss:
    target_real_weight: 20.0
    adv_weight: 0.1
    adv_weight_warmup_epochs: 0
  latent_augmix:
    width: 2
  raw_corrupt_consistency:
    max_batches: 2

evaluation:
  pn2021_limit: 64

runner:
  matrix:
    center:
      - ningbo

run_record:
  purpose: Smoke-check raw-JSD corruption curriculum command generation and runtime branch activation on one target center.
  result_summary: Pending smoke result.
  registration_status: provisional
