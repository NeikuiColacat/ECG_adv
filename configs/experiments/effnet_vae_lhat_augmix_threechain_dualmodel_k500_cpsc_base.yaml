extends:
  - effnet_vae_lhat_augmix_threechain_locked_k500.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_dualmodel_k500_cpsc_base
  description: CPSC-only base for EfficientNet VAE-LHAT locked three-chain AugMix tuned on dual_model_10to15pp_v1 PN2021-C stress.

training:
  epochs: 30
  batch_size: 128
  eval_batch_size: 192
  num_workers: 4

adaptation:
  run_tag_extra: k500_dual3ch_base
  anchors:
    k_anchor: 800
  hull:
    lambda: 0.05
    steps: 3
  loss:
    adv_weight: 0.8
    adv_weight_warmup_epochs: 5
  latent_augmix:
    topology: locked_three_chain
    copies: 3
    latent_weight_cap: 0.25
    width: 3
    depth: 1
    alpha: 1.0
    mixture:
      mode: fixed
      prob: 0.65
    severity: 5
    severity_profile: custom
    severity_params_file: configs/corruption_profiles/pn2021c_dual_model_10to15pp_v1.yaml
    severity_params_name: dual_model_10to15pp_v1
    ops:
      - powerline_noise
      - emg_noise
      - baseline_wander
      - baseline_shift
      - random_leads_masking
    consistency:
      enabled: true
      consistency_weight: 4.0
      consistency_loss: jsd
      bce_weight: 1.0
      max_batches: 0

postprocess:
  commands: []

runner:
  matrix:
    center:
      - cpsc_2018

run_record:
  purpose: Shared CPSC-only base for dual_model_10to15pp_v1 locked three-chain AugMix parameter smoke tests.
  result_summary: Pending. Child configs override the tuned scalars and should be evaluated on clean PN2021 plus official s5 and dual_model PN2021-C.
  registration_status: provisional
