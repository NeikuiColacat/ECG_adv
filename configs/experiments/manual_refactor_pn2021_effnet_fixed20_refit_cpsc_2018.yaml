schema_version: 1

experiment:
  name: manual_refactor_pn2021_effnet_fixed20_refit_cpsc_2018
  purpose: Refit the family-balanced EfficientNet Direct baseline on full combined CPSC 2018 plus Extra K500 for the globally selected epoch.

entrypoint:
  name: refit_pn2021_direct
  config: train/PN2021_fixed20.yaml
  arguments:
    - --model
    - efficientnet1dv2
    - --method-config
    - train/methods/direct_depth23_fixed20.yaml
    - --center
    - cpsc_2018
    - --selection-json
    - /home/linbinhao/ECG_adv_data/runs/manual_refactor/managed_pn2021_effnet_direct_selection_h30/training/direct_baseline_selection.json

output:
  run_dir: /home/linbinhao/ECG_adv_data/runs/manual_refactor/managed_pn2021_effnet_fixed20_refit_cpsc_2018
  if_exists: error
  delegate_output_subdir: training
