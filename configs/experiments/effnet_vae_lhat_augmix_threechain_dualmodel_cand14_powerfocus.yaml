extends:
  - effnet_vae_lhat_augmix_threechain_dualmodel_k500_cpsc_base.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_dualmodel_cand14_powerfocus
  description: "Four-center EfficientNet VAE-LHAT locked three-chain AugMix candidate: target-real raw corruption chains with powerline-focused AugMix sampling and stronger direct JSD/BCE pressure."

training:
  epochs: 40
  batch_size: 64
  num_workers: 8

adaptation:
  run_tag_extra: trraw_pf_c10_cw25_b24_aw8_tw25_hs10_lam18
  anchors:
    k_anchor: 2400
  hull:
    lambda: 0.18
    steps: 10
    lr: 0.50
  loss:
    target_real_weight: 25.0
    adv_weight: 8.0
    adv_weight_warmup_epochs: 1
  latent_augmix:
    copies: 10
    latent_weight_cap: 0.30
    depth: 1
    signal_space: raw_pre_zscore
    corruption_source: target_real
    op_schedule: per_op
    chain_weights: "0.45,0.45,0.10"
    ops:
      - powerline_noise
      - powerline_noise
      - powerline_noise
      - powerline_noise
      - emg_noise
      - emg_noise
      - baseline_wander
      - baseline_shift
      - random_leads_masking
      - random_leads_masking
    mixture:
      mode: fixed
      prob: 1.0
    consistency:
      enabled: true
      consistency_weight: 25.0
      consistency_loss: jsd
      bce_weight: 24.0
      max_batches: 0

runner:
  matrix:
    center:
      - ningbo
      - chapman_shaoxing
      - cpsc_2018
      - georgia

run_record:
  purpose: Test whether stronger within-AugMix pressure and powerline-focused operator scheduling can materially improve dual_model_10to15pp_v1 PN2021-C recovery without adding a standalone raw-supervised branch or preprocessing stabilizer.
  result_summary: Pending.
  registration_status: provisional
