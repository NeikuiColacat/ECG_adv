extends:
  - effnet_vae_lhat_augmix_threechain_dualmodel_cand17_trainproxy_rawtarget_cpsc.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_dualmodel_cand20_trainproxy_shiftmask_cpsc
  description: "CPSC probe: train-proxy target-real raw three-chain AugMix focused on the shift, wander, and masking operators that remained weakest in recovery."

adaptation:
  run_tag_extra: trraw_proxy_shiftmask_c8_cw18_b10_aw5_tw50_hs8_lam12
  anchors:
    k_anchor: 2200
  hull:
    lambda: 0.12
    steps: 8
    lr: 0.45
  loss:
    target_real_weight: 50.0
    adv_weight: 5.0
    adv_weight_warmup_epochs: 2
  latent_augmix:
    copies: 8
    latent_weight_cap: 0.20
    chain_weights: "0.48,0.45,0.07"
    ops:
      - baseline_shift
      - baseline_shift
      - baseline_wander
      - baseline_wander
      - random_leads_masking
      - random_leads_masking
      - emg_noise
      - powerline_noise
    consistency:
      enabled: true
      consistency_weight: 18.0
      consistency_loss: jsd
      bce_weight: 10.0
      max_batches: 0

run_record:
  purpose: Test whether explicitly over-sampling the currently weakest recovered operators improves mean CPSC PN2021-C recovery without leaving the VAE-LH plus locked three-chain AugMix mainline.
  result_summary: Pending.
  registration_status: provisional
