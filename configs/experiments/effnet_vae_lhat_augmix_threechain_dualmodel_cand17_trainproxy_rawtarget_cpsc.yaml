extends:
  - effnet_vae_lhat_augmix_threechain_dualmodel_cand14_powerfocus.yaml

experiment:
  name: effnet_vae_lhat_augmix_threechain_dualmodel_cand17_trainproxy_rawtarget_cpsc
  description: "CPSC probe: target-real raw locked three-chain AugMix with a 100Hz training proxy for native powerline and stronger clean target anchor."

training:
  epochs: 30
  batch_size: 64
  num_workers: 8

adaptation:
  run_tag_extra: trraw_proxy_c6_cw14_b5_aw4_tw60_hs8_lam15
  anchors:
    k_anchor: 2000
  hull:
    lambda: 0.15
    steps: 8
    lr: 0.45
  loss:
    target_real_weight: 60.0
    adv_weight: 4.0
    adv_weight_warmup_epochs: 2
  latent_augmix:
    copies: 6
    latent_weight_cap: 0.30
    depth: 1
    signal_space: raw_pre_zscore
    corruption_source: target_real
    op_schedule: per_op
    chain_weights: "0.45,0.45,0.10"
    severity_profile: custom
    severity_params_file: configs/corruption_profiles/pn2021c_dual_model_10to15pp_train_proxy_v1.yaml
    severity_params_name: dual_model_10to15pp_train_proxy_v1
    ops:
      - powerline_noise
      - emg_noise
      - baseline_wander
      - baseline_shift
      - random_leads_masking
      - random_leads_masking
    mixture:
      mode: fixed
      prob: 1.0
    consistency:
      enabled: true
      consistency_weight: 14.0
      consistency_loss: jsd
      bce_weight: 5.0
      max_batches: 0

runner:
  matrix:
    center:
      - cpsc_2018

run_record:
  purpose: Test whether replacing the over-strong 100Hz powerline training view with a native-powerline proxy improves CPSC recovery while preserving the VAE-LH plus locked three-chain AugMix mainline.
  result_summary: Pending.
  registration_status: provisional
