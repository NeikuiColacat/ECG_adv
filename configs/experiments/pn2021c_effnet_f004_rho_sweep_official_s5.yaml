  - ../defaults/effnet_f004_rho_sweep_locked.yaml

experiment:
  name: pn2021c_effnet_f004_rho_sweep_official_s5
  description: Official S5 known-family evaluation for the independent F-004 rho sweep.

logging:
  child_artifacts:
    - eval_pn2021_c_v7_refexcluded_stream_standard_official_s5_locked.json
