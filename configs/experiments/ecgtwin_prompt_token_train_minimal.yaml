extends:
  - ../defaults/common_v7_sjr_rgq_super5.yaml

experiment:
  name: ecgtwin_prompt_token_train_minimal
  description: Managed minimal ECGTwin prompt-token training launch surface for the PN2021 target-center token bank.
  status: active-wrapped

training:
  total_steps: 2500
  batch_size: 16
  num_workers: ${resources.default_num_workers}
  optimizer:
    lr: 0.001
    weight_decay: 0.0001
  grad_clip: 1.0
  amp:
    dtype: bf16
  log_every: 20
  save_every: 0

model:
  backbone: ecgtwin_prompt_token
  name: ecgtwin_prompt_token_train_minimal
  num_classes: 5
  ecgtwin_config: model/ECGTwin/config/DiT_ECGTwin.yaml

adaptation:
  method: ecgtwin_prompt_token_train
  prompt_token:
    cache_root: ${paths.data_root}/ecgtwin_prompt_token_super5/cache_v1
    prompt_bank: ${adaptation.prompt_token.cache_root}/text_prompt_bank.pt
    output_root: ${paths.output_root}/ecgtwin_prompt_token_minimal/${runtime.run_id}
    centers: ${paper_protocol.centers.target_4}
    classes: [NORM, MI, STTC]
    sample_strategy: center_class_balanced
    token_mode: direct
    n_token_vectors: 4
    ref_text_mode: actual_report
    init_noise_std: 0.01
    token_repeat: 1
    token_orth_weight: 0.0

logging:
  child_artifacts:
    - run_config.json
    - metrics.jsonl
    - prompt_token_bank.pt
  postprocess_artifacts: []

runner:
  entrypoint: scripts/ecgtwin_gen/train_center_prompt_tokens.py
  name: ${experiment.name}
  argv:
    - --centers
    - ${adaptation.prompt_token.centers}
    - --cache_root
    - ${adaptation.prompt_token.cache_root}
    - --prompt_bank
    - ${adaptation.prompt_token.prompt_bank}
    - --save_dir
    - ${adaptation.prompt_token.output_root}/prompt_token_train
    - --ecgtwin_config
    - ${model.ecgtwin_config}
    - --device
    - cuda
    - --K
    - ${paper_protocol.kshot.k}
    - --seed
    - ${paper_protocol.kshot.seed}
    - --total_steps
    - ${training.total_steps}
    - --batch_size
    - ${training.batch_size}
    - --num_workers
    - ${training.num_workers}
    - --lr
    - ${training.optimizer.lr}
    - --weight_decay
    - ${training.optimizer.weight_decay}
    - --grad_clip
    - ${training.grad_clip}
    - --amp_dtype
    - ${training.amp.dtype}
    - --init_noise_std
    - ${adaptation.prompt_token.init_noise_std}
    - --token_repeat
    - ${adaptation.prompt_token.token_repeat}
    - --sample_strategy
    - ${adaptation.prompt_token.sample_strategy}
    - --n_token_vectors
    - ${adaptation.prompt_token.n_token_vectors}
    - --token_mode
    - ${adaptation.prompt_token.token_mode}
    - --token_orth_weight
    - ${adaptation.prompt_token.token_orth_weight}
    - --ref_text_mode
    - ${adaptation.prompt_token.ref_text_mode}
    - --log_every
    - ${training.log_every}
    - --save_every
    - ${training.save_every}

lineage:
  replaces_legacy_surface: scripts/ecgtwin_gen/run_center_token_v42_noleak_style_semantic_20260503.sh
  scope: prompt_token_bank_training_minimal
  notes:
    - This launch-only config captures the minimal v40/v42-style PN2021 prompt-token bank training contract without style/semantic auxiliary checkpoints.
    - Generation and gating are managed by separate configs that consume this run_id-scoped prompt_token_bank.pt.
