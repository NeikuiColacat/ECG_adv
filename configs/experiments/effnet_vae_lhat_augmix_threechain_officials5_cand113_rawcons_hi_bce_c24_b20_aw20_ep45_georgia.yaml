run_record:
  purpose: >-
    Test whether c107/c112 under-recover official severity-5 composite
    PN2021-C because the raw corruption AugMix branches are under-regularized,
    not because the VAE-LH adversarial stream is too weak. This preserves the
    locked three-chain AugMix topology, official standard severity-5 raw
    corruptions, depth-3 triple-cover operator schedule, same-label/local
    VAE-LH hard-sample search, clean K500 anchor stream, and last-checkpoint
    policy. It only raises JSD/BCE consistency pressure on the AugMix views and
