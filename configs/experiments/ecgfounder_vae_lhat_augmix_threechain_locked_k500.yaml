extends:
  - ../defaults/ecgfounder_v7_sjr_rgq_defaults.yaml

experiment:
  name: ecgfounder_vae_lhat_augmix_threechain_locked_k500
  description: Locked ECGFounder K500 full-FT VAE-LHAT plus three-chain AugMix with official PN2021-C severity 5 and last-checkpoint evaluation.

paper_protocol:
  kshot:
    seed: 20260531
    subset_seed: 20260531
  selection:
    policy: last_checkpoint_only
    allowed_data: [target_k500_train_all, ptbxl_source_sanity]
    forbid_k500_validation_split: true
    forbid_best_checkpoint_selection: true
    forbid_heldout_target_labels: true
    forbid_full_target_distribution_tuning: true

model:
  init_model_path: ${paths.output_root}/ecgfounder_k500_fullft_locked/${runtime.run_id}/runs/${matrix.center}_k500_fullft_locked/last_model.pt

data:
  target_real_npz_suffix: .raw1000.npz

training:
  epochs: 10
  batch_size: 64
  eval_batch_size: 128
  num_workers: ${resources.default_num_workers}
  source_train_limit: 0
  optimizer:
    name: adamw
    lr: 0.00002
    weight_decay: 0.0001

adaptation:
  method: ecgfounder_vae_lhat_augmix_threechain_locked_last
  run_name: ${matrix.center}_vae_lhat_augmix_threechain_locked
  supervised_input_mode: raw1000
  loss:
    source_weight: 1.0
    target_real_weight: 40.0
    source_bce_loss_weight: 1.0
    target_real_bce_loss_weight: 1.0
    adv_bce_loss_weight: 1.0
    adv_clean_logit_anchor_weight: 0.0
  vae:
    enabled: true
    adv_weight: 20.0
    adv_weight_warmup_epochs: 0
    k_anchor: 160
    anchor_sample_mode: hard_bce
    anchor_sample_power: 1.5
    anchor_sample_min_weight: 0.0001
    anchor_class_max_repeat: 0
    min_class_count: 1
    anchor_base_root: ${data.kshot_subset_root}
  hull:
    M: 20
    lambda: 0.05
    steps: 5
    lr: 0.25
    weight_mode: optimized
    dirichlet_alpha: 1.0
    include_anchor: true
    label_mode: primary
    partner_pool: target
    attack_pos_weight_source: none
    attack_pos_weight_clip: 50.0
  attack:
    pgd_eps: 2.0
    pgd_batch: 4
  latent_augmix:
    enabled: true
    topology: locked_three_chain
    chain_roles:
      - name: chain1
        role: official_corruption_chain
      - name: chain2
        role: official_corruption_chain
      - name: chain3
        role: vae_lhat_adversarial_waveform
    copies: 1
    width: 3
    depth: -1
    alpha: 1.0
    severity: 5
    severity_profile: standard
    ops:
      - powerline_noise
      - emg_noise
      - baseline_wander
      - baseline_shift
      - random_leads_masking
    renorm: false
    clip_abs: 6.0

runner:
  entrypoint: ecg_adv_gen/runner/ecgfounder_fullft.py
  adapter: ecgfounder_fullft
  matrix:
    center: ${paper_protocol.centers.target_4}

logging:
  child_artifacts:
    - last_model.pt
    - training_log.json
    - eval_result.json

run_record:
  purpose: "Locked ECGFounder main-method run: all K500 samples train, full model trainable, no K500 validation split, last checkpoint only, two official corruption chains plus one VAE-LHAT adversarial waveform chain."
  result_summary: Pending. Evaluate PN2021 clean and PN2021-C official severity 5 after managed training completes.
  registration_status: provisional
