extends:
  - ../defaults/effnet1dv2_v7_sjr_rgq_defaults.yaml

experiment:
  name: effnet_direct_k500_v7_sjr_rgq_matrix
  description: Per-center EfficientNet1DV2 direct K500 v7 SJR/RGQ matrix launch surface replacing the Direct portion of the dated multiseed runner.

runner:
  entrypoint: scripts/paper/run_direct_finetune_k500_20260516.py
  adapter: direct_finetune
  name: ${experiment.name}_${matrix.center}
  matrix:
    center: ${paper_protocol.centers.target_4}

adaptation:
  method: direct_target_k500_finetune

lineage:
  replaces_legacy_surface: scripts/paper/run_effnet_v7_multiseed_kshot_matrix_20260530.py
  scope: direct_k500_only
  notes:
    - This managed config replaces the Direct K500 per-center command expansion from the dated matrix runner.
    - Percent-shot protocols require the subset-export stage to provide per-center K values before they can be safely YAML-managed.
