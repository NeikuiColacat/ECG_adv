schema_version: 1

method:
  name: vae_lhat_three_chain_augmix
  random_seed_file: random_seed.yaml
  random_namespace: ecg_manual_refactor_augmix_v1
  corruption_timing: before_per_sample_global_zscore

topology:
  width: 3
  chain_roles:
    - paper_anchored_s5_corruption_chain
    - paper_anchored_s5_corruption_chain
    - vae_lhat_adversarial_waveform
  chain3_additional_corruption: false
  raw_supervised_side_branch: false
  allowed_sampling_rates_hz: [100, 500]

corruption_chains:
  operator_config: augmentation/operators.yaml
  profile: pn2021c_paper_anchored_s5_v1
  profile_status: project_defined_paper_anchored_not_official_preset
  severity: 5
  depths: [2, 3]
  sampling: uniform_over_all_depth2_depth3_compositions
  replacement_within_chain: false
  canonical_operator_order:
    - powerline_noise
    - emg_noise
    - baseline_wander
    - baseline_shift
    - random_leads_masking
  independent_chains: true

mixing:
  chain_weights: dirichlet
  dirichlet_alpha: 1.0
  clean_augmented_mix: beta
  beta_alpha: 1.0
  vae_chain_weight_cap: null

output:
  return_raw_components: true
  return_raw_mixture: true
  return_global_zscore_mixture: true
  normalization_epsilon: 1.0e-6

training_loss_defaults:
  clean_bce_weight: 1.0
  augmented_view_bce_weight: 1.0
  consistency:
    name: multilabel_bernoulli_jsd
    weight: 2.0
    minimum_views: 2
  direct_vae_hard_view_bce: true
