schema_version: 1

model:
  name: ecgtwin_vae
  checkpoint_path: model/ECGTwin/checkpoints/vae_model.pth
  checkpoint_format: encoder_decoder_state_dict
  input_layout: time_channel
  input_points: 1024
  input_channels: 12
  input_units: mV
  input_lead_order: [I, II, III, aVR, aVF, aVL, V1, V2, V3, V4, V5, V6]
  latent_shape: [4, 128]
  latent_scale: 0.18215
  encoder_default: deterministic_mean
  decoder_output_layout: time_channel
  decoder_output_units: mV
  freeze: true
  eval_mode: true

checkpoint_contract:
  expected_top_level_keys: [encoder, decoder]
  expected_encoder_state_keys: 104
  expected_decoder_state_keys: 136
  strict: true

classifier_bridge:
  canonical_lead_order: [I, II, III, aVR, aVL, aVF, V1, V2, V3, V4, V5, V6]
  ecgtwin_to_ptbxl_indices: [0, 1, 2, 3, 5, 4, 6, 7, 8, 9, 10, 11]
  first_bottleneck_points: 1000
  interpolation: linear_align_corners
