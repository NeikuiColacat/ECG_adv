schema_version: 1
profile_name: pn2021_direct_depth23_fixed20_family_balanced

references:
  split_config: data/splits.yaml
  data_load_config: data/data_load.yaml
  random_seed_config: random_seed.yaml
  source_baseline_registry: baselines/ptbxl_source_v1.yaml

protocol:
  status: family_balanced_direct_baseline
  centers: [ningbo, chapman_shaoxing, cpsc_2018, georgia]
  merge_cpsc_2018_extra_into_cpsc_2018: true
  partition: k500
  use_all_k500: true
  validation_split: false
  checkpoint_selection: last
  heldout_ref_exclusion_required: true
  mapping_version: v7_super5_sjr_rgq_review_20260528
  mapping_hash: 555ec85d5b51
  class_order: [CD, HYP, MI, NORM, STTC]
  tuning:
    train_partition: k500_tune_train
    validation_partition: k500_tune_validation
    train_records_per_center: 400
    validation_records_per_center: 100

random_seed:
  stream_namespace: pn2021_fixed20_family_balanced_training
  comparison_group: pn2021_direct_depth23_fixed20_family_balanced
  replicate_id: 0
  deterministic_algorithms: false

fairness:
  budget_policy: matched_base
  method_profile_required: true
  matched_outer_optimizer_steps: true
  same_source_checkpoint_required: true
  one_optimizer_step_per_base_batch: true
  loss_normalization: per_origin_record_mean
  ineligible_anchor_policy: clean_loss_only

data:
  source_sampling_rate_hz: 100
  source_points: 1000
  source_layout: time_channel
  source_units: mV
  sanitize_nonfinite: true
  augmentation_timing: before_per_sample_global_zscore
  model_normalization: per_sample_global_zscore
  normalization_epsilon: 1.0e-6
  hard_sample_quality_gate:
    policy: reject_to_clean_only
    require_finite: true
    minimum_global_std_mV: 1.0e-4
    maximum_absolute_mV: 20.0
  ecgfounder_upsampling:
    target_sampling_rate_hz: 500
    target_points: 5000
    interpolation: linear
    align_corners: true

training:
  device: cuda
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  cache_mode: mmap
  validate_values: sample
  selection_resident: true
  selection_resident_pin_memory: false
  drop_last: false
  optimizer: adamw
  scheduler: cosine_annealing
  gradient_clip_norm: 1.0
  amp:
    enabled: true
    dtype: bfloat16
  model_profiles:
    efficientnet1dv2:
      epochs: 30
      batch_size: 128
      learning_rate: 5.0e-5
      weight_decay: 1.0e-4
      minimum_learning_rate_ratio: 0.01
    ecgfounder:
      epochs: 20
      batch_size: 64
      learning_rate: 2.0e-5
      weight_decay: 1.0e-4
      minimum_learning_rate_ratio: 0.01

diagnostics:
  diagnostics_every_steps: 20
  persist_epoch_ineligible_hashes: true
  performance_timing:
    enabled: true
    interval_steps: 20
    cuda_events: true
    scope: fixed20_base_group_excludes_logging_otherwise_sampled_step

output:
  root_dir: /home/linbinhao/ECG_adv_data/runs/manual_refactor/pn2021_fixed20
  if_exists: error
  checkpoint_write_policy: final_only
  checkpoints_dir: checkpoints
  last_checkpoint_file: last.pt
  history_file: training_history.json
  diagnostics_file: diagnostics.jsonl
  result_file: train_result.json
  method_resources_file: method_resources.json
