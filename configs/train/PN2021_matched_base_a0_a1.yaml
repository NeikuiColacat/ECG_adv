schema_version: 1
profile_name: matched_base_a0_a1_e25_e30_v1

references:
  split_config: data/splits.yaml
  data_load_config: data/data_load.yaml
  random_seed_config: random_seed.yaml
  source_baseline_registry: baselines/ptbxl_source_v1.yaml

protocol:
  status: prospective_matched_base_a0_a1
  centers: [ningbo, chapman_shaoxing, cpsc_2018, georgia]
  merge_cpsc_2018_extra_into_cpsc_2018: true
  partition: k500
  use_all_k500: true
  validation_split: false
  checkpoint_selection: last
  heldout_ref_exclusion_required: true
  mapping_version: v7_super5_sjr_rgq_review_20260528
  mapping_hash: 555ec85d5b51
  class_order: [CD, HYP, MI, NORM, STTC]

random_seed:
  stream_namespace: matched_base_a0_a1_e25_e30_v1
  comparison_group: matched_base_a0_a1_e25_e30_20260814
  replicate_id: 0
  deterministic_algorithms: false

fairness:
  budget_policy: matched_base
  matched_outer_optimizer_steps: true
  same_source_checkpoint_required: true
  one_optimizer_step_per_base_batch: true
  loss_normalization: per_origin_record_mean
  ineligible_anchor_policy: clean_loss_only

data:
  source_sampling_rate_hz: 100
  source_points: 1000
  source_layout: time_channel
  source_units: mV
  sanitize_nonfinite: true
  augmentation_timing: before_per_sample_global_zscore
  model_normalization: per_sample_global_zscore
  normalization_epsilon: 1.0e-6
  hard_sample_quality_gate:
    policy: reject_to_clean_only
    require_finite: true
    minimum_global_std_mV: 1.0e-4
    maximum_absolute_mV: 20.0
  ecgfounder_upsampling:
    target_sampling_rate_hz: 500
    target_points: 5000
    interpolation: linear
    align_corners: true

training:
  device: cuda
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  cache_mode: mmap
  validate_values: sample
  selection_resident: true
  selection_resident_pin_memory: false
  drop_last: false
  optimizer: adamw
  scheduler: cosine_annealing
  gradient_clip_norm: 1.0
  amp:
    enabled: true
    dtype: bfloat16
  model_profiles:
    efficientnet1dv2:
      epochs: 25
      scheduler_horizon_epochs: 30
      batch_size: 128
      learning_rate: 5.0e-5
      weight_decay: 1.0e-4
      minimum_learning_rate_ratio: 0.01
    ecgfounder:
      epochs: 30
      scheduler_horizon_epochs: 30
      batch_size: 64
      learning_rate: 3.0e-5
      weight_decay: 1.0e-4
      minimum_learning_rate_ratio: 0.01

output:
  root_dir: /home/linbinhao/ECG_adv_data/runs/matched_base_a0_a1_r0_20260814
  if_exists: error
  checkpoint_write_policy: final_only
  checkpoints_dir: checkpoints
  last_checkpoint_file: last.pt
  history_file: training_history.json
  result_file: train_result.json
  method_resources_file: method_resources.json
