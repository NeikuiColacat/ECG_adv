schema_version: 1

method:
  id: a3c_depth23_v1
  profile_version: 1
  api_version: 1
  scientific_arm: A3c
  status: locked_comparison_candidate
  description: Online supervised official-family depth-2/3 corruption view.

nodes:
  clean_identity:
    type: identity_raw100_view
    implementation: builtin
    implementation_version: 1
    status: implemented
    inputs:
      waveform: clean_raw
    outputs:
      waveform: clean_view
  depth23_corruption:
    type: canonical_depth23_corruption_view
    implementation: registered
    implementation_version: 1
    status: implemented_engine
    inputs:
      waveform: clean_view
      rng: corruption_rng
      operator_profile: operator_profile
    outputs:
      waveform: corrupted_view
      provenance: corruption_provenance

inputs:
  clean_raw:
    type: ecg_waveform
    domain: raw_mV
    layout: batch_time_lead
    sampling_rate_hz: 100
    points: 1000
    leads: 12
  targets:
    type: multilabel_targets
    class_order: [CD, HYP, MI, NORM, STTC]
  hash_ids:
    type: unique_record_ids

outputs:
  clean_view:
    type: ecg_waveform
    source: clean_identity.waveform
    domain: raw_mV
    sampling_rate_hz: 100
    points: 1000
  corrupted_view:
    type: ecg_waveform
    source: depth23_corruption.waveform
    domain: raw_mV
    sampling_rate_hz: 100
    points: 1000
  corruption_provenance:
    type: per_record_corruption_provenance
    source: depth23_corruption.provenance

objective:
  terms:
    - id: clean_bce
      type: multilabel_bce_with_logits
      view: clean_view
      targets: targets
      weight: 1.0
    - id: corrupted_bce
      type: multilabel_bce_with_logits
      view: corrupted_view
      targets: targets
      weight: 1.0

resources:
  model:
    type: caller_owned_classifier
  operator_profile:
    type: config_reference
    path: augmentation/operators.yaml
    profile: pn2021c_paper_anchored_s5_v1
    severity: 5
  corruption_rng:
    type: isolated_torch_generator
    seed_config: random_seed.yaml
    namespace: method_a3c_depth23_v1

contracts:
  normalization_owner: online_trainer
  optimizer_owner: online_trainer
  canonical_input_sampling_rate_hz: 100
  operator_domain_sampling_rate_hz: 500
  canonical_output_sampling_rate_hz: 100
  corruption_depths: [2, 3]
  corruption_sampling: uniform_over_all_depth2_depth3_compositions
  one_corrupted_view_per_base_record_per_step: true
  materialized_dataset_expansion_allowed: false
  one_outer_optimizer_step_per_clean_batch: true
  complete_k500_base_record_exposure: true
  heldout_target_feedback_allowed: false
