schema_version: 1

method:
  id: exp_lhat_as_sixth_branch_v1
  profile_version: 1
  api_version: 1
  scientific_arm: experimental
  status: experimental_unimplemented_nodes
  description: Treat one LHAT view as a sixth choice beside the five physiological corruption operators.

nodes:
  clean_identity:
    type: identity_raw100_view
    implementation: builtin
    implementation_version: 1
    status: implemented
    inputs: {waveform: clean_raw}
    outputs: {waveform: clean_view}
  lhat:
    type: vae_lhat_hard_view
    implementation: registered
    implementation_version: 1
    status: implemented
    inputs:
      waveform: clean_view
      targets: targets
      hash_ids: hash_ids
      latent_pool: latent_pool
      decoder: vae_decoder
      classifier: model
      rng: lhat_rng
      config: lhat_config
    outputs: {waveform: lhat_view, diagnostics: lhat_diagnostics}
  six_branch_selector:
    type: five_corruptions_plus_lhat_branch_selector
    implementation: null
    implementation_version: 1
    status: experimental_unimplemented
    inputs:
      clean_waveform: clean_view
      sixth_branch_waveform: lhat_view
      operator_profile: operator_profile
      rng: branch_rng
    outputs: {waveform: selected_view, provenance: branch_provenance}

inputs:
  clean_raw:
    type: ecg_waveform
    domain: raw_mV
    layout: batch_time_lead
    sampling_rate_hz: 100
    points: 1000
    leads: 12
  targets: {type: multilabel_targets, class_order: [CD, HYP, MI, NORM, STTC]}
  hash_ids: {type: unique_record_ids}

outputs:
  clean_view: {type: ecg_waveform, source: clean_identity.waveform}
  lhat_view: {type: ecg_waveform, source: lhat.waveform}
  selected_view: {type: ecg_waveform, source: six_branch_selector.waveform}
  branch_provenance: {type: per_record_branch_provenance, source: six_branch_selector.provenance}

objective:
  eligibility_scaling: eligible_count_over_batch_size
  terms:
    - {id: clean_bce, type: multilabel_bce_with_logits, view: clean_view, targets: targets, weight: 1.0}
    - {id: selected_view_bce, type: multilabel_bce_with_logits, view: selected_view, targets: targets, weight: 1.0}

resources:
  model: {type: caller_owned_classifier}
  vae: {type: config_reference, path: train/vae.yaml}
  latent_pool: {type: runtime_train_only_exact_label_pool}
  vae_decoder: {type: runtime_frozen_decoder}
  lhat_config: {type: config_reference, path: train/lhat.yaml}
  operator_profile:
    type: config_reference
    path: augmentation/operators.yaml
    profile: pn2021c_paper_anchored_s5_v1
    severity: 5
  lhat_rng:
    type: isolated_torch_generator
    seed_config: random_seed.yaml
    namespace: exp_lhat_as_sixth_branch_v1_lhat
  branch_rng:
    type: isolated_torch_generator
    seed_config: random_seed.yaml
    namespace: exp_lhat_as_sixth_branch_v1_selector

contracts:
  normalization_owner: online_trainer
  optimizer_owner: online_trainer
  canonical_input_output_sampling_rate_hz: 100
  physiological_operator_domain_sampling_rate_hz: 500
  sixth_branch_source: lhat_view
  lhat_view_generated_once_per_record_step: true
  branch_provenance_required: true
  one_outer_optimizer_step_per_clean_batch: true
  executable: false
