  source_dataset: ptbxl_super5
  target_dataset: pn2021
  mapping:
    version: v7_super5_sjr_rgq_review_20260528
    hash: 555ec85d5b51
    class_order: [CD, HYP, MI, NORM, STTC]
  adaptation_population: per_center_fixed_k500_only
  outside_k500_model_access: false
  reference_exclusion_per_center: 500
  logical_centers: [ningbo, chapman_shaoxing, cpsc_2018, georgia]
  cpsc_2018_includes_extra: true
  primary_aggregation: equal_weighted_four_center_mean
  corruption:
    profile: pn2021c_paper_anchored_s5_v1
    severity: 5
    depths: [2, 3]
    view_count: 20
    domain: raw_mV_before_per_sample_global_zscore

active_development_mainline:
  lock_id: aligned_targetonly_augmix_lhat_simplified_20260805
  status: locked_prospective_replication_recipe
  paper_use: development_only
  paper_claim_allowed: false
  selection:
    decision: user_directed_simplification_override_after_development_search
    candidate_count: 94
    efficientnet1dv2_candidate_count: 52
    ecgfounder_candidate_count: 42
    original_preregistered_gate_pass_count: 0
    independent_test_evidence: false
    feedback_scope: four_center_ref_excluded_clean_and_pn2021c_development_scores
  method:
    scientific_arm: twochain_augmix_simclr_then_rotating4_plus_attack_then_contract_lhat_bce
    stage1:
      view_pair: clean_vs_one_twochain_augmix_strong_view
      objective: simclr
      temperature: 0.5
      augmix_internal_chains: 2
      dirichlet_alpha: 0.5
      clean_mix_beta_alpha: 0.5
      frozen_source_logit_anchor_weight: 5.0
      classifier_head_trainable: false
      ptbxl_replay_weight: 0.0
      vicreg_weight: 0.0
      vae_lhat_tail_fraction: 0.0
    stage2:
      clean_family_weight: 0.5
      corrupted_family_weight: 0.5
      corruption_schedule: rotating_two_depth2_plus_two_depth3
      supervised_logit_anchor_teacher: frozen_post_stage1_pre_stage2_snapshot
      auxiliary_gradient_merge: direct_sum
    vae_lhat:
      neighbor_policy: exact_positive_set_nonself
      num_candidates: 20
      hull_lambda: 0.6
      pgd_epsilon_l2_standardized: 12.0
      steps: 10
      learning_rate: 0.25
      attack_objective: maximize_multilabel_bce_with_logits
      contract_version: preflip_maxloss_grid_v1
      t_values: [0.25, 0.5, 0.75, 1.0]
      margin_retention: 0.5
      selection: maximum_bce_without_new_clean_correct_flip
      auxiliary_alpha: 2.0
    backbone_optimization:
      efficientnet1dv2:
        stage1_steps: 1024
        stage2_epochs: 23
        stage2_learning_rate: 0.00005
        batch_size: 128
        supervised_logit_anchor_weight: 2.0
      ecgfounder:
        stage1_steps: 256
        stage2_epochs: 30
        stage2_learning_rate: 0.00003
        batch_size: 64
        supervised_logit_anchor_weight: 0.5
    excluded:
      - stage1_vae_lhat_tail
      - anchor_kl_attack_objective
      - clean_hard_jsd
      - vicreg
      - ptbxl_source_replay
      - pcgrad
      - multistart
      - residual_head
