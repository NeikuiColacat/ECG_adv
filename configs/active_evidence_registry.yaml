schema_version: 2
updated: 2026-08-06
purpose: >
  Separate the current prospective manual-refactor recipe from historical
  trusted evidence. A launch config is not evidence by itself.

evidence_policy:
  primary_metric_view: drop_all_zero
  promotion_requires_registered_artifacts: true
  archived_reports_are_evidence_by_default: false
  managed_configs_are_evidence_by_default: false
  forbidden_selection_information:
    - heldout_target_labels
    - full_target_center_class_distribution
  rules:
    - never_promote_development_scores_to_blind_test_claims
    - report_mapping_hash_and_reference_exclusion_with_every_main_table
    - report_backbones_separately_before_cross_backbone_summary
    - retain_all_zero_kept_only_as_secondary_audit_view

