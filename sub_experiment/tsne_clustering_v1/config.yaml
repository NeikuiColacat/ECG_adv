# ECGTwin center-conditional generation t-SNE experiment config

centers:
  - chapman_shaoxing
  - cpsc_2018
  - cpsc_2018_extra
  - georgia
  - ningbo

pn2021_root: /root/autodl-tmp/physionet2021/training

n_real_per_center: 100
n_gen_per_center: 50

seed: 0

ecgtwin:
  device: cuda:0
  load_encoder: true
  load_text_model: true   # auto-downloaded on first run, cached afterwards
  num_inference_steps: 50
  batch_size: 1

ecgfounder:
  weights_path: /root/autodl-tmp/ecgfounder/checkpoint/12_lead_ECGFounder.pth
  device: cuda:0

tsne:
  perplexity: 30
  random_state: 0
  n_iter: 1000

metrics:
  knn_k: 10

output_root: /root/autodl-tmp/sub_experiment/tsne_clustering_v1
