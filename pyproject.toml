[project]
name = "ecg-adv-graduate"
version = "0.1.0"
description = "Graduate-project ECG generation, abnormal detection, and Streamlit demo environment."
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.0",
    "diffusers==0.32.2",
    "ecg-plot>=0.2.8",
    "einops==0.8.0",
    "fastparquet>=2024.11",
    "huggingface-hub==0.30.1",
    "ipykernel>=6.29",
    "joblib>=1.4",
    "matplotlib>=3.8",
    "numpy>=1.26,<2.0",
    "onnx>=1.16",
    "onnxruntime-gpu>=1.20",
    "opencv-python-headless>=4.10",
    "openpyxl>=3.1",
    "pandas>=2.1,<3.0",
    "pillow>=10.4",
    "plotly>=5.24",
    "protobuf>=4.25",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "safetensors==0.5.3",
    "scikit-learn>=1.5,<1.6",
    "scipy>=1.11,<1.14",
    "seaborn>=0.13",
    "sentencepiece>=0.2",
    "statsmodels>=0.14",
    "streamlit>=1.39",
    "tokenizers==0.21.1",
    "torch>=2.5",
    "torchmetrics>=1.6",
    "tqdm>=4.66",
    "transformers==4.50.3",
    "wfdb>=4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "jupyterlab>=4.3",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
