    - 1.0
    pretrain_prototype_weight: 0.0
    pretrain_prototype_temperature: 0.2
    pretrain_prototype_quantile: 0.2
    pretrain_prototype_bank_batches: 0
    pretrain_rank_weight: 0.0
    pretrain_rank_margin: 0.5
    pretrain_rank_temperature: 1.0
    pretrain_strong_pseudo_weight: 0.0
    residual_head_mode: none
    residual_head_width: 64
    residual_head_dropout: 0.1
    residual_head_scale: 0.1
