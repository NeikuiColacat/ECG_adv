schema_version: 1

method:
  id: pure_m20_lhat_augmix
  profile_version: 1
  api_version: 1
  scientific_arm: VAE_LHAT_hard_chain_plus_bounded_AugMax
  status: exploratory_matched_two_factor_hardness_coupled
  description: >-
    Keep the same one-clean plus twenty-view budget, but choose each
    three-chain convex mixture from a small frozen candidate set by current
    per-record BCE, subject to a bounded gain. The only ingredients remain
    two stochastic PN2021-C corruption chains and one ECGTwin VAE-LHAT hard
    chain. Across the twenty views, chain1 deterministically covers each
    canonical depth-2/3 composition once, chain2 remains stochastic, and no
    fixed20 endpoint is directly supervised. No teacher, class weighting,
    source replay, or external data enters.

nodes:
  clean_identity:
    type: identity_raw100_view
    implementation: builtin
    implementation_version: 1
    status: implemented
    inputs: {waveform: clean_raw}
    outputs: {waveform: clean_view}
  lhat:
    type: vae_lhat_hard_view
    implementation: registered
    implementation_version: 1
    status: implemented_repaired_exact_label_nonself
    inputs:
      waveform: clean_view
      targets: targets
      hash_ids: hash_ids
      latent_pool: latent_pool
      decoder: vae_decoder
      classifier: model
      rng: lhat_rng
      config: lhat_config
    outputs: {waveform: lhat_view, diagnostics: lhat_diagnostics, accepted_indices: lhat_accepted_indices}
  augmix_01: &augmix_node
    type: vae_lhat_threechain_augmix_view
    implementation: registered
    implementation_version: 1
    status: implemented_pure_two_raw_plus_lhat_chain
    inputs: {clean_waveform: clean_view, chain3_waveform: lhat_view, rng: augmix_rng, config: augmix_config}
    outputs: {waveform: augmix_view_01, diagnostics: augmix_diagnostics_01}
  augmix_02: {<<: *augmix_node, outputs: {waveform: augmix_view_02, diagnostics: augmix_diagnostics_02}}
  augmix_03: {<<: *augmix_node, outputs: {waveform: augmix_view_03, diagnostics: augmix_diagnostics_03}}
  augmix_04: {<<: *augmix_node, outputs: {waveform: augmix_view_04, diagnostics: augmix_diagnostics_04}}
  augmix_05: {<<: *augmix_node, outputs: {waveform: augmix_view_05, diagnostics: augmix_diagnostics_05}}
  augmix_06: {<<: *augmix_node, outputs: {waveform: augmix_view_06, diagnostics: augmix_diagnostics_06}}
  augmix_07: {<<: *augmix_node, outputs: {waveform: augmix_view_07, diagnostics: augmix_diagnostics_07}}
  augmix_08: {<<: *augmix_node, outputs: {waveform: augmix_view_08, diagnostics: augmix_diagnostics_08}}
  augmix_09: {<<: *augmix_node, outputs: {waveform: augmix_view_09, diagnostics: augmix_diagnostics_09}}
  augmix_10: {<<: *augmix_node, outputs: {waveform: augmix_view_10, diagnostics: augmix_diagnostics_10}}
  augmix_11: {<<: *augmix_node, outputs: {waveform: augmix_view_11, diagnostics: augmix_diagnostics_11}}
  augmix_12: {<<: *augmix_node, outputs: {waveform: augmix_view_12, diagnostics: augmix_diagnostics_12}}
  augmix_13: {<<: *augmix_node, outputs: {waveform: augmix_view_13, diagnostics: augmix_diagnostics_13}}
  augmix_14: {<<: *augmix_node, outputs: {waveform: augmix_view_14, diagnostics: augmix_diagnostics_14}}
  augmix_15: {<<: *augmix_node, outputs: {waveform: augmix_view_15, diagnostics: augmix_diagnostics_15}}
  augmix_16: {<<: *augmix_node, outputs: {waveform: augmix_view_16, diagnostics: augmix_diagnostics_16}}
  augmix_17: {<<: *augmix_node, outputs: {waveform: augmix_view_17, diagnostics: augmix_diagnostics_17}}
  augmix_18: {<<: *augmix_node, outputs: {waveform: augmix_view_18, diagnostics: augmix_diagnostics_18}}
  augmix_19: {<<: *augmix_node, outputs: {waveform: augmix_view_19, diagnostics: augmix_diagnostics_19}}
  augmix_20: {<<: *augmix_node, outputs: {waveform: augmix_view_20, diagnostics: augmix_diagnostics_20}}

inputs:
  clean_raw: {type: ecg_waveform, domain: raw_mV, layout: batch_time_lead, sampling_rate_hz: 100, points: 1000, leads: 12}
  targets: {type: multilabel_targets, class_order: [CD, HYP, MI, NORM, STTC]}
  hash_ids: {type: unique_record_ids}

outputs:
  clean_view: {type: ecg_waveform, source: clean_identity.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  lhat_view: {type: ecg_waveform, source: lhat.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_01: {type: ecg_waveform, source: augmix_01.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_02: {type: ecg_waveform, source: augmix_02.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_03: {type: ecg_waveform, source: augmix_03.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_04: {type: ecg_waveform, source: augmix_04.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_05: {type: ecg_waveform, source: augmix_05.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_06: {type: ecg_waveform, source: augmix_06.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_07: {type: ecg_waveform, source: augmix_07.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_08: {type: ecg_waveform, source: augmix_08.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_09: {type: ecg_waveform, source: augmix_09.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_10: {type: ecg_waveform, source: augmix_10.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_11: {type: ecg_waveform, source: augmix_11.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_12: {type: ecg_waveform, source: augmix_12.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_13: {type: ecg_waveform, source: augmix_13.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_14: {type: ecg_waveform, source: augmix_14.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_15: {type: ecg_waveform, source: augmix_15.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_16: {type: ecg_waveform, source: augmix_16.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_17: {type: ecg_waveform, source: augmix_17.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_18: {type: ecg_waveform, source: augmix_18.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_19: {type: ecg_waveform, source: augmix_19.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  augmix_view_20: {type: ecg_waveform, source: augmix_20.waveform, domain: raw_mV, sampling_rate_hz: 100, points: 1000}
  lhat_diagnostics: {type: namespaced_method_diagnostics, source: lhat.diagnostics}

objective:
  eligibility_scaling: eligible_count_over_batch_size
  terms:
    - {id: clean_bce, type: multilabel_bce_with_logits, view: clean_view, targets: targets, weight: 1.0}
    - {id: augmix_01_bce, type: multilabel_bce_with_logits, view: augmix_view_01, targets: targets, weight: 0.05}
    - {id: augmix_02_bce, type: multilabel_bce_with_logits, view: augmix_view_02, targets: targets, weight: 0.05}
    - {id: augmix_03_bce, type: multilabel_bce_with_logits, view: augmix_view_03, targets: targets, weight: 0.05}
    - {id: augmix_04_bce, type: multilabel_bce_with_logits, view: augmix_view_04, targets: targets, weight: 0.05}
    - {id: augmix_05_bce, type: multilabel_bce_with_logits, view: augmix_view_05, targets: targets, weight: 0.05}
    - {id: augmix_06_bce, type: multilabel_bce_with_logits, view: augmix_view_06, targets: targets, weight: 0.05}
    - {id: augmix_07_bce, type: multilabel_bce_with_logits, view: augmix_view_07, targets: targets, weight: 0.05}
    - {id: augmix_08_bce, type: multilabel_bce_with_logits, view: augmix_view_08, targets: targets, weight: 0.05}
    - {id: augmix_09_bce, type: multilabel_bce_with_logits, view: augmix_view_09, targets: targets, weight: 0.05}
    - {id: augmix_10_bce, type: multilabel_bce_with_logits, view: augmix_view_10, targets: targets, weight: 0.05}
    - {id: augmix_11_bce, type: multilabel_bce_with_logits, view: augmix_view_11, targets: targets, weight: 0.05}
    - {id: augmix_12_bce, type: multilabel_bce_with_logits, view: augmix_view_12, targets: targets, weight: 0.05}
    - {id: augmix_13_bce, type: multilabel_bce_with_logits, view: augmix_view_13, targets: targets, weight: 0.05}
    - {id: augmix_14_bce, type: multilabel_bce_with_logits, view: augmix_view_14, targets: targets, weight: 0.05}
    - {id: augmix_15_bce, type: multilabel_bce_with_logits, view: augmix_view_15, targets: targets, weight: 0.05}
    - {id: augmix_16_bce, type: multilabel_bce_with_logits, view: augmix_view_16, targets: targets, weight: 0.05}
    - {id: augmix_17_bce, type: multilabel_bce_with_logits, view: augmix_view_17, targets: targets, weight: 0.05}
    - {id: augmix_18_bce, type: multilabel_bce_with_logits, view: augmix_view_18, targets: targets, weight: 0.05}
    - {id: augmix_19_bce, type: multilabel_bce_with_logits, view: augmix_view_19, targets: targets, weight: 0.05}
    - {id: augmix_20_bce, type: multilabel_bce_with_logits, view: augmix_view_20, targets: targets, weight: 0.05}
    - id: clean_augmix_01_02_lhat_jsd
      type: multilabel_bernoulli_jsd
      views: [clean_view, augmix_view_01, augmix_view_02, lhat_view]
      weight: 0.6

resources:
  model: {type: caller_owned_classifier}
  vae: {type: config_reference, path: train/vae.yaml}
  latent_pool: {type: runtime_train_only_exact_label_pool}
  vae_decoder: {type: runtime_frozen_decoder}
  lhat_config: {type: config_reference, path: train/lhat.yaml}
  augmix_config: {type: config_reference, path: train/augmix.yaml}
  lhat_rng: {type: isolated_torch_generator, seed_config: random_seed.yaml, namespace: pure_m20_lhat}
  augmix_rng: {type: isolated_torch_generator, seed_config: random_seed.yaml, namespace: pure_m20_augmix}

contracts:
  executable: true
  normalization_owner: online_trainer
  optimizer_owner: online_trainer
  canonical_input_sampling_rate_hz: 100
  operator_domain_sampling_rate_hz: 500
  canonical_output_sampling_rate_hz: 100
  fixed20_train_views: 0
  augmix_train_views: 0
  clean_supervised_views_per_base_record_step: 1
  augmix_supervised_views_per_base_record_step: 20
  total_supervised_views_per_base_record_step: 21
  shared_lhat_generation_per_base_record_step: 1
  shared_lhat_reused_as_chain3_across_augmix_views: true
  calibrated_augmix_mixing:
    strength_min: 0.0
    strength_max: 1.0
    vae_chain_weight_cap: 1.0
    mixing_mode: convex_capped
    vae_chain_probability: 1.0
    rationale: ordinary_uncapped_dirichlet_chain_weights_and_beta_clean_mix
  augmix_topology: two_depth23_corruption_chains_plus_one_shared_lhat_chain
  augmix_chain_weights: dirichlet_alpha_1
  augmix_clean_mix: beta_alpha_1
  augmix_rng_independence: executor_seed_includes_distinct_node_id
  hardness_coupled_augmax:
    enabled: true
    method: hardest_per_record_bce_under_cap
    candidates:
      - {weights: [0.50, 0.25, 0.25], strength: 0.75}
      - {weights: [0.25, 0.50, 0.25], strength: 0.75}
      - {weights: [0.25, 0.25, 0.50], strength: 0.75}
      - {weights: [0.3333333333, 0.3333333333, 0.3333333334], strength: 1.0}
      - {weights: [0.20, 0.20, 0.60], strength: 1.0}
      - {weights: [0.70, 0.15, 0.15], strength: 1.0}
    minimum_bce_gain: 0.0
    maximum_bce_gain: 0.15
    fallback: classic_sampled_augmix
    cache_scope: one_generate_call
    classifier_forward_chunk_size: 256
  canonical_chain1_coverage:
    enabled: true
    schedule: augmix_node_id_1_to_20
    chain1: matching_canonical_depth23_composition
    chain2: independent_random_depth23_composition
    chain3: shared_vae_lhat_hard_view
    direct_fixed20_endpoint_supervision: false
  lhat_unavailable_fallback: augmix_only_chain3_clean
  objective_global_scale: 0.5
  objective_scale_adapter_mode: scale_only
  effective_objective_weights:
    clean_total: 0.5
    augmix_total: 0.5
    augmix_per_view: 0.025
    lhat_direct_bce: 0.0
    classic_jsd: 0.3
  one_outer_optimizer_step_per_clean_batch: true
  optimizer_step_budget_match: direct_depth23_fixed20
  supervised_view_budget_match: direct_depth23_fixed20
  batch_norm_running_stats_policy: objective_view_weighted_once_per_base_batch
  batch_norm_objective_view_weights:
    clean_view: 0.5
    augmix_view_01: 0.025
    augmix_view_02: 0.025
    augmix_view_03: 0.025
    augmix_view_04: 0.025
    augmix_view_05: 0.025
    augmix_view_06: 0.025
    augmix_view_07: 0.025
    augmix_view_08: 0.025
    augmix_view_09: 0.025
    augmix_view_10: 0.025
    augmix_view_11: 0.025
    augmix_view_12: 0.025
    augmix_view_13: 0.025
    augmix_view_14: 0.025
    augmix_view_15: 0.025
    augmix_view_16: 0.025
    augmix_view_17: 0.025
    augmix_view_18: 0.025
    augmix_view_19: 0.025
    augmix_view_20: 0.025
    lhat_view: 0.0
  lhat_label_policy: exact_positive_set_nonself
  lhat_hull_lambda: 0.35
  lhat_steps: 10
  lhat_pgd_epsilon_l2_standardized: 10.0
  lhat_direct_supervision: false
  augmix_chain3_source: shared_lhat_view
  augmix_chain3_additional_corruption: false
  classifier_guided_raw_view_selection: hardness_coupled_coefficients_only
  teacher_or_distillation: false
  class_reweighting: false
  tuning_partition_only: k500_tune_train
  full_k500_refit_supported: false
  heldout_target_feedback_allowed: false
